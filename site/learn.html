<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<script>if(localStorage.getItem('yaoguayi_theme')==='dark')document.documentElement.classList.add('dark-theme');</script>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>读易 · 爻卦易</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}

/* ===== Theme variables (same as index/hexagram) ===== */
:root{
  --bg:#f5f0e8;--bg-alt:#ede8dc;--ink:#2c2420;--ink-light:#5a4e44;
  --muted:#7a6e64;--faint:#a09080;--ghost:#c8b8a4;--whisper:#d4c8b8;
  --border:rgba(26,26,26,0.08);--border-strong:rgba(26,26,26,0.15);
  --vermilion:#c0392b;--vermilion-faint:rgba(192,57,43,0.15);
  --nav-bg:rgba(245,240,232,0.92);--card-bg:rgba(237,232,220,0.5);
  --hover-bg:rgba(26,26,26,0.06);--shadow:rgba(26,26,26,0.08);
  --svg-fill:#2c2420;--svg-circle:#5c3a30;
}
:root.dark-theme{
  --bg:#1c1a16;--bg-alt:#252320;--ink:#e8e0d4;--ink-light:#ccc4b8;
  --muted:#a49c8c;--faint:#847c6c;--ghost:#5a5448;--whisper:#3e3830;
  --border:rgba(232,224,212,0.10);--border-strong:rgba(232,224,212,0.18);
  --vermilion:#e07060;--vermilion-faint:rgba(224,112,96,0.18);
  --nav-bg:rgba(28,26,22,0.94);--card-bg:rgba(37,35,32,0.7);
  --hover-bg:rgba(232,224,212,0.08);--shadow:rgba(0,0,0,0.3);
  --svg-fill:#e8e0d4;--svg-circle:#a07860;
}

body{font-family:'Noto Serif SC','STSong','SimSun','Georgia',serif;
  color:var(--ink);background:var(--bg);overflow-x:hidden;
  transition:background 0.4s,color 0.4s;}

/* ===== Top Nav ===== */
.top-nav{position:fixed;top:0;left:0;right:0;z-index:200;
  background:var(--nav-bg);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border-bottom:0.5px solid var(--border);display:flex;align-items:center;
  justify-content:space-between;padding:0 24px;height:48px;
  transition:background 0.4s,border-color 0.4s;}
.nav-left{display:flex;gap:16px;align-items:center;}
.nav-home{font-size:12px;color:var(--muted);text-decoration:none;
  letter-spacing:0.08em;transition:color 0.2s;
  font-family:'Noto Sans SC',system-ui,sans-serif;}
.nav-home:hover{color:var(--vermilion);}
.nav-logo{display:flex;align-items:center;justify-content:center;}
.nav-logo svg{width:28px;height:28px;transition:opacity 0.2s;}
.nav-logo svg circle{stroke:var(--svg-circle);}
.nav-logo svg line{stroke:var(--svg-fill);}
.nav-logo svg line:nth-child(4),.nav-logo svg line:nth-child(5){stroke:var(--vermilion);}
.nav-logo:hover svg{opacity:0.7;}
.nav-tools{display:flex;align-items:center;gap:4px;}
.nav-btn{width:32px;height:32px;border:none;background:none;color:var(--muted);
  cursor:pointer;border-radius:6px;display:flex;align-items:center;
  justify-content:center;transition:background 0.2s,color 0.2s;}
.nav-btn:hover{background:var(--hover-bg);color:var(--ink);}
.nav-btn svg{width:16px;height:16px;}
.nav-account{position:relative;}
.account-dropdown{position:absolute;top:calc(100% + 8px);right:0;width:200px;
  background:var(--bg);border:0.5px solid var(--border-strong);
  border-radius:6px;box-shadow:0 4px 20px var(--shadow);
  opacity:0;transform:translateY(-4px);pointer-events:none;
  transition:opacity 0.25s,transform 0.25s;z-index:210;}
.account-dropdown.show{opacity:1;transform:translateY(0);pointer-events:auto;}
.dropdown-header{padding:12px 16px;border-bottom:0.5px solid var(--border);
  font-size:11px;letter-spacing:0.1em;color:var(--faint);}
.dropdown-item{display:flex;align-items:center;gap:10px;
  padding:10px 16px;font-size:12px;letter-spacing:0.06em;color:var(--ink-light);
  cursor:pointer;transition:background 0.15s,color 0.15s;text-decoration:none;}
.dropdown-item:hover{background:var(--hover-bg);color:var(--vermilion);}
.dropdown-item svg{width:16px;height:16px;color:var(--faint);flex-shrink:0;}
.dropdown-item:hover svg{color:var(--vermilion);}
.dropdown-divider{height:0.5px;background:var(--border);margin:4px 0;}

/* ===== Layout ===== */
.page-wrapper{display:flex;max-width:1100px;margin:0 auto;
  padding:72px 32px 48px;gap:40px;min-height:100vh;}

/* ===== Sidebar TOC ===== */
.learn-sidebar{width:200px;flex-shrink:0;position:sticky;top:72px;
  align-self:flex-start;max-height:calc(100vh - 96px);overflow-y:auto;}
.toc-title{font-size:11px;color:var(--faint);letter-spacing:0.15em;
  text-transform:uppercase;margin-bottom:12px;
  font-family:'Noto Sans SC',system-ui,sans-serif;font-weight:600;}
.toc-category{margin-bottom:16px;}
.toc-cat-label{font-size:10px;color:var(--ghost);letter-spacing:0.12em;
  text-transform:uppercase;margin-bottom:6px;padding-left:8px;
  font-family:'Noto Sans SC',system-ui,sans-serif;font-weight:600;}
.toc-item{display:block;padding:6px 8px 6px 12px;font-size:13px;
  color:var(--muted);text-decoration:none;border-left:2px solid transparent;
  border-radius:0 4px 4px 0;transition:all 0.2s;line-height:1.4;}
.toc-item:hover{color:var(--ink);background:var(--hover-bg);
  border-left-color:var(--ghost);}
.toc-item.active{color:var(--vermilion);border-left-color:var(--vermilion);
  background:var(--vermilion-faint);font-weight:600;}

/* ===== Content area ===== */
.learn-content{flex:1;min-width:0;}

/* Article card */
.knowledge-article{margin-bottom:48px;padding-bottom:48px;
  border-bottom:0.5px solid var(--border);}
.knowledge-article:last-child{border-bottom:none;margin-bottom:0;}
.article-header{margin-bottom:28px;}
.article-icon{font-size:28px;margin-bottom:8px;display:block;}
.article-title{font-size:22px;font-weight:700;letter-spacing:0.06em;
  margin-bottom:4px;line-height:1.3;}
.article-subtitle{font-size:13px;color:var(--muted);letter-spacing:0.04em;}
.article-source{font-size:11px;color:var(--faint);margin-top:8px;
  font-family:'Noto Sans SC',system-ui,sans-serif;}

/* Section within article */
.article-section{margin-bottom:24px;}
.section-heading{font-size:15px;font-weight:600;color:var(--ink);
  margin-bottom:12px;padding-bottom:6px;
  border-bottom:0.5px solid var(--border);letter-spacing:0.04em;}
.section-body{font-size:14px;line-height:1.9;color:var(--ink-light);
  white-space:pre-line;}
.section-body strong{color:var(--ink);font-weight:600;}

/* Tables within content */
.section-body table{width:100%;border-collapse:collapse;margin:12px 0;
  font-size:13px;line-height:1.6;}
.section-body th,.section-body td{padding:6px 10px;text-align:left;
  border:0.5px solid var(--border);}
.section-body th{background:var(--bg-alt);font-weight:600;color:var(--ink);
  font-size:12px;letter-spacing:0.04em;}
.section-body td{color:var(--ink-light);}

/* Empty state */
.learn-empty{text-align:center;padding:80px 24px;color:var(--muted);
  font-size:14px;}

/* ===== Footer ===== */
.site-footer{padding:24px 32px;text-align:center;font-size:11px;
  color:var(--faint);border-top:0.5px solid var(--border);
  font-family:'Noto Sans SC',system-ui,sans-serif;letter-spacing:0.03em;}
.footer-row{display:flex;justify-content:space-between;align-items:center;
  max-width:1100px;margin:0 auto;}
.footer-left{display:flex;align-items:center;gap:6px;}
.footer-right{display:flex;align-items:center;gap:6px;}
.footer-sep{color:var(--whisper);}
.site-footer a{color:var(--vermilion);text-decoration:none;transition:color 0.2s;}
.site-footer a:hover{color:var(--muted);text-decoration:underline;}

/* ===== Responsive ===== */
@media(max-width:768px){
  .page-wrapper{flex-direction:column;padding:64px 16px 32px;gap:0;}
  .learn-sidebar{width:100%;position:static;max-height:none;
    margin-bottom:24px;padding-bottom:16px;
    border-bottom:0.5px solid var(--border);}
  .toc-category{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px;}
  .toc-cat-label{width:100%;margin-bottom:2px;}
  .toc-item{display:inline-block;border-left:none;border-radius:4px;
    padding:4px 10px;font-size:12px;}
  .toc-item.active{border-left:none;}
  .footer-row{flex-direction:column;align-items:center;text-align:center;gap:6px;}
  .footer-left,.footer-right{justify-content:center;flex-wrap:wrap;}
  .article-title{font-size:18px;}
}

/* ===== Admin Panel ===== */
.admin-panel{position:fixed;top:52px;right:0;bottom:0;width:300px;
  background:var(--bg);border-left:0.5px solid var(--border-strong);
  z-index:95;display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform 0.3s ease;
  box-shadow:-4px 0 20px var(--shadow);}
.admin-panel.open{transform:translateX(0);}
.admin-header{display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px;border-bottom:0.5px solid var(--border);flex-shrink:0;}
.admin-header-title{font-size:13px;letter-spacing:0.12em;color:var(--ink);
  font-family:'Noto Sans SC',system-ui,sans-serif;font-weight:600;}
.admin-close{width:28px;height:28px;border:none;background:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;border-radius:4px;
  color:var(--muted);transition:background 0.2s,color 0.2s;}
.admin-close:hover{background:var(--hover-bg);color:var(--vermilion);}
.admin-close svg{width:16px;height:16px;}
.admin-body{flex:1;overflow-y:auto;padding:16px;}
.section-list{list-style:none;display:flex;flex-direction:column;gap:2px;}
.section-item{display:flex;align-items:center;gap:10px;padding:8px 10px;
  border-radius:4px;cursor:pointer;transition:background 0.15s;}
.section-item:hover{background:var(--hover-bg);}
.section-item-id{font-size:10px;font-weight:600;color:var(--vermilion);
  font-family:'Cascadia Code','Fira Code','Consolas',monospace;
  background:var(--vermilion-faint);padding:2px 6px;border-radius:3px;white-space:nowrap;}
.section-item-name{font-size:11px;color:var(--ink-light);letter-spacing:0.04em;}
.section-badge{position:absolute;top:4px;right:4px;z-index:100;
  font-size:9px;font-weight:700;color:#fff;
  background:var(--vermilion);padding:2px 6px;border-radius:3px;
  font-family:'Cascadia Code','Fira Code','Consolas',monospace;
  letter-spacing:0.05em;pointer-events:none;opacity:0.85;
  box-shadow:0 1px 4px rgba(0,0,0,0.2);}
.section-item-sub{padding-left:28px;}
.section-item-sub .section-item-id{font-size:9px;background:transparent;
  color:var(--muted);padding:2px 4px;}
.section-badge-sub{font-size:8px;opacity:0.7;background:var(--ink-light);}

/* ===== Floating Notepad ===== */
.notepad-window{position:fixed;right:24px;bottom:24px;width:380px;height:320px;
  z-index:150;display:none;flex-direction:column;
  background:var(--bg);border:0.5px solid var(--border-strong);
  border-radius:6px;box-shadow:0 8px 32px var(--shadow);overflow:hidden;}
.notepad-window.visible{display:flex;}
.notepad-titlebar{display:flex;align-items:center;justify-content:space-between;
  padding:8px 12px;background:var(--bg-alt);cursor:grab;user-select:none;
  border-bottom:0.5px solid var(--border);flex-shrink:0;}
.notepad-titlebar:active{cursor:grabbing;}
.notepad-title{font-size:10px;letter-spacing:0.14em;color:var(--faint);
  font-family:'Noto Sans SC',system-ui,sans-serif;font-weight:500;}
.notepad-titlebar-btns{display:flex;align-items:center;gap:2px;}
.notepad-pin,.notepad-close{width:24px;height:24px;border:none;background:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;border-radius:4px;
  color:var(--muted);transition:background 0.2s,color 0.2s;}
.notepad-pin:hover,.notepad-close:hover{background:var(--hover-bg);color:var(--vermilion);}
.notepad-pin.active{color:var(--vermilion);}
.notepad-pin svg,.notepad-close svg{width:14px;height:14px;}
.notepad-toolbar{display:flex;align-items:center;gap:6px;padding:6px 12px;
  border-bottom:0.5px solid var(--border);flex-shrink:0;}
.notepad-btn{padding:3px 7px;border:0.5px solid var(--border);border-radius:3px;
  background:none;color:var(--muted);font-size:9px;letter-spacing:0.06em;
  cursor:pointer;transition:background 0.15s,color 0.15s;
  font-family:'Noto Sans SC',system-ui,sans-serif;}
.notepad-btn:hover{background:var(--hover-bg);color:var(--vermilion);}
.notepad-count{margin-left:auto;font-size:9px;color:var(--ghost);
  font-family:'Cascadia Code','Fira Code','Consolas',monospace;}
.notepad-body{display:flex;flex:1;min-height:0;}
.notepad-lines{width:32px;flex-shrink:0;padding:8px 4px;
  background:var(--bg-alt);color:var(--ghost);
  font-size:11px;line-height:1.5;text-align:right;
  font-family:'Cascadia Code','Fira Code','Consolas',monospace;
  overflow:hidden;white-space:pre;user-select:none;border-right:0.5px solid var(--border);}
.notepad-area{flex:1;resize:none;border:none;outline:none;padding:8px;
  background:var(--bg);color:var(--ink);
  font-size:11px;line-height:1.5;
  font-family:'Cascadia Code','Fira Code','Consolas',monospace;
  overflow-y:auto;}

/* ===== Fade-in ===== */
.fade-in{opacity:0;transform:translateY(12px);
  transition:opacity 0.5s ease,transform 0.5s ease;}
.fade-in.visible{opacity:1;transform:translateY(0);}
</style>
</head>
<body data-page="learn">

<!-- ===== Top Nav ===== -->
<nav class="top-nav" id="top-nav"></nav>

<!-- ===== Main layout ===== -->
<div class="page-wrapper">
  <aside class="learn-sidebar" id="learn-sidebar">
    <div class="toc-title">目录</div>
    <div id="toc-list">
      <!-- Dynamically populated from knowledge.json -->
    </div>
  </aside>

  <main class="learn-content" id="learn-content">
    <div class="learn-empty">加载中…</div>
  </main>
</div>

<!-- ===== Footer ===== -->
<footer class="site-footer" id="site-footer"></footer>

<!-- ===== Admin Panel (admin-only, sections) ===== -->
<div class="admin-panel" id="admin-panel">
  <div class="admin-header">
    <span class="admin-header-title">开发模式</span>
    <button class="admin-close" onclick="AdminPanel.close()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="admin-body" id="admin-sections">
    <!-- Dynamically populated by AdminPanel.updateSectionList() -->
  </div>
</div>

<!-- ===== Floating Notepad (all users) ===== -->
<div class="notepad-window" id="notepad-window">
  <div class="notepad-titlebar">
    <span class="notepad-title">记事本</span>
    <div class="notepad-titlebar-btns">
      <button class="notepad-pin" id="notepad-pin-btn" onclick="Notepad.togglePin()" title="固定显示">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 17v5"/><path d="M9 11V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v7"/><path d="M5 17h14"/><path d="M7 11l-2 6h14l-2-6"/></svg>
      </button>
      <button class="notepad-close" onclick="Notepad.hide()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
  </div>
  <div class="notepad-toolbar"><button class="notepad-btn" onclick="Notepad.selectAll()">全选</button><button class="notepad-btn" onclick="Notepad.clear()">清除</button><button class="notepad-btn" onclick="Notepad.saveToFile()">保存文件</button><span class="notepad-count" id="notepad-count">0 字 / 1 行</span></div>
  <div class="notepad-body"><div class="notepad-lines" id="notepad-lines">1
</div><textarea class="notepad-area" id="notepad-area" placeholder="随手记录..." spellcheck="false"></textarea></div>
</div>

<script src="/js/layout.js?v=1"></script>
<script src="/js/theme.js?v=3"></script>
<script src="/js/auth.js?v=2"></script>
<script src="/js/admin-panel.js?v=10"></script>
<script>
/* ===== Knowledge page renderer ===== */
(function() {
  const content = document.getElementById('learn-content');
  const tocList = document.getElementById('toc-list');

  fetch('/data/knowledge.json?v=1')
    .then(r => r.json())
    .then(articles => {
      if (!articles || articles.length === 0) {
        content.innerHTML = '<div class="learn-empty">暂无内容</div>';
        return;
      }
      renderTOC(articles);
      renderArticles(articles);
      initScrollSpy(articles);
      initFadeIn();

      // Jump to hash anchor if present
      if (location.hash) {
        const target = document.getElementById(location.hash.slice(1));
        if (target) setTimeout(() => target.scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);
      }
    })
    .catch(() => {
      content.innerHTML = '<div class="learn-empty">加载失败，请刷新重试</div>';
    });

  /** Render sidebar TOC grouped by category */
  function renderTOC(articles) {
    const categories = {};
    articles.forEach(a => {
      if (!categories[a.category]) categories[a.category] = [];
      categories[a.category].push(a);
    });
    let html = '';
    for (const [cat, items] of Object.entries(categories)) {
      html += `<div class="toc-category">`;
      html += `<div class="toc-cat-label">${esc(cat)}</div>`;
      items.forEach(a => {
        html += `<a class="toc-item" href="#${a.id}" data-id="${a.id}">${esc(a.title)}</a>`;
      });
      html += `</div>`;
    }
    tocList.innerHTML = html;
  }

  /** Render all articles */
  function renderArticles(articles) {
    content.innerHTML = articles.map(a => {
      const sectionsHtml = a.sections.map(s =>
        `<div class="article-section">
          <h3 class="section-heading">${esc(s.heading)}</h3>
          <div class="section-body">${formatContent(s.content)}</div>
        </div>`
      ).join('');

      return `<article class="knowledge-article fade-in" id="${a.id}">
        <div class="article-header">
          <span class="article-icon">${a.icon || ''}</span>
          <h2 class="article-title">${esc(a.title)}</h2>
          <div class="article-subtitle">${esc(a.subtitle || '')}</div>
          ${a.source ? `<div class="article-source">出处：${esc(a.source)}</div>` : ''}
        </div>
        ${sectionsHtml}
      </article>`;
    }).join('');
  }

  /** Format content: bold, tables, line breaks */
  function formatContent(text) {
    // Check for markdown-style tables
    if (text.includes('|')) {
      text = text.replace(/((?:\|.+\|\n?)+)/g, (match) => {
        const rows = match.trim().split('\n').filter(r => r.trim());
        if (rows.length < 2) return esc(match);
        // Filter out separator rows (|---|---|)
        const dataRows = rows.filter(r => !/^\|[\s\-:|]+\|$/.test(r.trim()));
        if (dataRows.length === 0) return '';
        let html = '<table>';
        dataRows.forEach((row, i) => {
          const cells = row.split('|').filter((c, idx, arr) => idx > 0 && idx < arr.length - 1);
          const tag = i === 0 ? 'th' : 'td';
          html += '<tr>' + cells.map(c => `<${tag}>${esc(c.trim())}</${tag}>`).join('') + '</tr>';
        });
        html += '</table>';
        return html;
      });
    }
    // Bold **text**
    text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    return text;
  }

  /** Scroll spy: highlight active TOC item */
  function initScrollSpy(articles) {
    const ids = articles.map(a => a.id);
    const tocItems = tocList.querySelectorAll('.toc-item');

    function update() {
      let activeId = ids[0];
      for (const id of ids) {
        const el = document.getElementById(id);
        if (el && el.getBoundingClientRect().top <= 120) activeId = id;
      }
      tocItems.forEach(item => {
        item.classList.toggle('active', item.dataset.id === activeId);
      });
    }

    window.addEventListener('scroll', update, { passive: true });
    update();
  }

  /** Fade-in on scroll */
  function initFadeIn() {
    const obs = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
    }, { threshold: 0.05 });
    document.querySelectorAll('.fade-in').forEach(el => obs.observe(el));
  }

  function esc(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }
})();

/* Init admin panel & notepad */
if (typeof AdminPanel !== 'undefined') AdminPanel.init();
if (typeof Notepad !== 'undefined') Notepad.init();
</script>
</body>
</html>
