<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>卦象详情 · 爻卦易</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:'Noto Serif SC','STSong','SimSun','Georgia',serif;
  color:#2c2420;background:#f5f0e8;overflow-x:hidden;
  min-height:100vh;display:flex;flex-direction:column;}

/* ===== Auth Gate ===== */
.auth-gate{position:fixed;inset:0;z-index:9999;background:#f5f0e8;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  transition:opacity 0.7s cubic-bezier(0.4,0,0.2,1);}
.auth-gate.hidden{opacity:0;pointer-events:none;}
.auth-gate.removed{display:none;}
.auth-logo svg{width:56px;height:56px;margin-bottom:20px;}
.auth-label{font-size:9px;letter-spacing:0.3em;color:#c0392b;margin-bottom:28px;
  font-family:'Noto Sans SC',system-ui,sans-serif;font-weight:600;}
.auth-form{display:flex;flex-direction:column;align-items:center;gap:14px;}
.auth-input{width:240px;padding:10px 16px;border:0.5px solid rgba(26,26,26,0.15);
  border-radius:3px;background:rgba(237,232,220,0.5);
  font-family:'Noto Serif SC',serif;font-size:13px;letter-spacing:0.08em;
  color:#2c2420;outline:none;text-align:center;transition:border-color 0.3s,box-shadow 0.3s;}
.auth-input:focus{border-color:rgba(192,57,43,0.3);box-shadow:0 0 0 3px rgba(192,57,43,0.06);}
.auth-input::placeholder{color:#c8b8a4;letter-spacing:0.12em;}
.auth-btn{width:240px;padding:10px 0;border:none;border-radius:3px;cursor:pointer;
  background:#2c2420;color:#f5f0e8;font-family:'Noto Sans SC',system-ui,sans-serif;
  font-size:11px;letter-spacing:0.18em;font-weight:500;transition:background 0.3s,transform 0.2s;}
.auth-btn:hover{background:#3d3630;transform:translateY(-1px);}
.auth-btn:active{transform:translateY(0);}
.auth-error{font-size:10px;color:#c0392b;letter-spacing:0.1em;opacity:0;
  transition:opacity 0.3s;height:16px;font-family:'Noto Sans SC',system-ui,sans-serif;}
.auth-error.show{opacity:1;}

/* ===== Fade-in ===== */
.fade-in{opacity:0;transform:translateY(20px);
  transition:opacity 0.7s cubic-bezier(0.25,0.46,0.45,0.94),transform 0.7s cubic-bezier(0.25,0.46,0.45,0.94);}
.fade-in.visible{opacity:1;transform:translateY(0);}
.fade-in.d1{transition-delay:0.1s;}.fade-in.d2{transition-delay:0.2s;}
.fade-in.d3{transition-delay:0.3s;}.fade-in.d4{transition-delay:0.4s;}
.fade-in.d5{transition-delay:0.5s;}.fade-in.d6{transition-delay:0.6s;}

/* ===== Top Navigation ===== */
.top-nav{position:sticky;top:0;z-index:100;
  background:rgba(245,240,232,0.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border-bottom:0.5px solid rgba(26,26,26,0.08);padding:10px 24px;
  display:flex;align-items:center;justify-content:space-between;
  font-family:'Noto Sans SC',system-ui,sans-serif;}
.nav-left{display:flex;align-items:center;gap:16px;}
.nav-back{font-size:13px;letter-spacing:0.1em;color:#7a6e64;text-decoration:none;
  display:flex;align-items:center;gap:6px;transition:color 0.2s;}
.nav-back:hover{color:#c0392b;}
.nav-back::before{content:'←';font-size:15px;}
.nav-logo{display:flex;align-items:center;gap:8px;text-decoration:none;}
.nav-logo svg{width:28px;height:28px;}
.nav-logo-text{font-size:10px;letter-spacing:0.25em;color:#a09080;font-weight:500;}
/* 右侧工具栏 */
.nav-tools{display:flex;align-items:center;gap:4px;}
.nav-btn{width:32px;height:32px;border:none;background:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;border-radius:6px;
  color:#7a6e64;transition:background 0.2s,color 0.2s;}
.nav-btn:hover{background:rgba(26,26,26,0.06);color:#2c2420;}
.nav-btn svg{width:18px;height:18px;}
/* 主题切换动画 */
.nav-btn .icon-sun,.nav-btn .icon-moon{transition:opacity 0.3s,transform 0.3s;}
/* 账户下拉菜单 */
.nav-account{position:relative;}
.account-dropdown{position:absolute;top:calc(100% + 8px);right:0;width:200px;
  background:#f5f0e8;border:0.5px solid rgba(26,26,26,0.1);
  border-radius:6px;box-shadow:0 4px 20px rgba(26,26,26,0.08);
  opacity:0;transform:translateY(-4px);pointer-events:none;
  transition:opacity 0.25s,transform 0.25s;z-index:110;}
.account-dropdown.show{opacity:1;transform:translateY(0);pointer-events:auto;}
.dropdown-header{padding:12px 16px;border-bottom:0.5px solid rgba(26,26,26,0.06);
  font-size:11px;letter-spacing:0.1em;color:#a09080;}
.dropdown-item{display:flex;align-items:center;gap:10px;
  padding:10px 16px;font-size:12px;letter-spacing:0.06em;color:#5a4e44;
  cursor:pointer;transition:background 0.15s,color 0.15s;text-decoration:none;}
.dropdown-item:hover{background:rgba(26,26,26,0.04);color:#c0392b;}
.dropdown-item svg{width:16px;height:16px;color:#a09080;flex-shrink:0;}
.dropdown-item:hover svg{color:#c0392b;}
.dropdown-item.disabled{color:#c8b8a4;cursor:default;}
.dropdown-item.disabled:hover{background:none;color:#c8b8a4;}
.dropdown-item.disabled svg{color:#d4c8b8;}
.dropdown-divider{height:0.5px;background:rgba(26,26,26,0.06);margin:4px 0;}

/* ===== Two-Column Layout ===== */
.hex-detail{max-width:1000px;margin:0 auto;padding:32px 28px;flex:1;
  display:flex;gap:40px;align-items:flex-start;
  transition:max-width 0.35s cubic-bezier(0.4,0,0.2,1),
             margin-right 0.35s cubic-bezier(0.4,0,0.2,1);}
/* 面板展开时，主内容让位 */
body.panel-open .hex-detail{margin-right:320px;}

/* 左侧 sticky 卦象面板 — 固定左上角 */
.hex-sidebar{width:220px;flex-shrink:0;position:sticky;top:68px;
  text-align:center;padding:20px 0;}
.sidebar-title{display:flex;align-items:baseline;justify-content:center;gap:8px;margin-bottom:4px;}
.sidebar-name{font-size:28px;letter-spacing:0.1em;color:#2c2420;}
.sidebar-pinyin{font-size:14px;color:#a09080;font-family:'Noto Sans SC',system-ui,sans-serif;}
.sidebar-id{font-size:12px;color:#c8b8a4;letter-spacing:0.1em;
  font-family:'Noto Sans SC',system-ui,sans-serif;margin-bottom:16px;}
/* 大爻图（含爻名链接） */
.sidebar-lines{margin:0 auto 12px;display:flex;justify-content:center;}
.sidebar-lines svg a text{transition:fill 0.2s;}
.sidebar-lines svg a:hover text{fill:#c0392b;}
/* 上下卦信息 */
.sidebar-trigrams{display:flex;justify-content:center;gap:20px;
  font-size:12px;letter-spacing:0.1em;color:#7a6e64;
  font-family:'Noto Sans SC',system-ui,sans-serif;}
.sidebar-trigrams span{display:flex;align-items:center;gap:4px;}
.trigram-label{color:#a09080;font-size:10px;}
/* 左侧分隔线 */
.sidebar-divider{width:60%;margin:16px auto;height:0.5px;background:rgba(26,26,26,0.08);}

/* 右侧主内容 */
.hex-content{flex:1;min-width:0;}

/* ===== Content Sections ===== */
.section{margin-bottom:40px;padding-bottom:40px;
  border-bottom:0.5px solid rgba(26,26,26,0.08);}
.section:last-of-type{border-bottom:none;}
.section-label{font-size:12px;letter-spacing:0.3em;color:#c0392b;margin-bottom:16px;
  font-family:'Noto Sans SC',system-ui,sans-serif;font-weight:600;}
.section-text{font-size:18px;line-height:2;letter-spacing:0.06em;color:#2c2420;}
.section-trans{font-size:15px;line-height:1.9;letter-spacing:0.04em;color:#7a6e64;
  margin-top:12px;padding-left:16px;border-left:2px solid rgba(192,57,43,0.15);}

/* ===== Yaoci ===== */
.yaoci-list{list-style:none;}
.yaoci-item{margin-bottom:28px;padding-bottom:28px;
  border-bottom:0.5px solid rgba(26,26,26,0.05);}
.yaoci-item:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
/* 点击爻名跳转时，内容对齐到左侧卦图顶部（nav高度52px + padding16px） */
.yaoci-item[id]{scroll-margin-top:68px;}
/* 最后一个爻（如上六/上九）下方留白，确保能滚到顶部对齐 */
.yaoci-item:last-child{padding-bottom:60vh;}
.yaoci-name{font-size:14px;letter-spacing:0.18em;color:#c0392b;margin-bottom:8px;
  font-weight:600;font-family:'Noto Sans SC',system-ui,sans-serif;}
.yaoci-text{font-size:17px;line-height:1.9;letter-spacing:0.06em;color:#2c2420;margin-bottom:8px;}
.yaoci-trans{font-size:14px;line-height:1.8;letter-spacing:0.04em;color:#7a6e64;
  margin-bottom:8px;padding-left:16px;border-left:2px solid rgba(192,57,43,0.15);}
.yaoci-xiang{font-size:14px;line-height:1.8;letter-spacing:0.06em;color:#8c7e72;
  padding-left:16px;border-left:1.5px solid rgba(26,26,26,0.1);}
.yaoci-xiang-label{font-size:11px;color:#a09080;letter-spacing:0.12em;
  font-family:'Noto Sans SC',system-ui,sans-serif;margin-bottom:2px;}

/* ===== Ruby 注音 ===== */
ruby{ruby-position:over;}
ruby rt{font-size:10px;color:#a09080;font-family:'Noto Sans SC',system-ui,sans-serif;
  font-weight:400;letter-spacing:0;}

/* ===== 术语下划线 ===== */
.term-link{text-decoration:none;border-bottom:1.5px dashed rgba(192,57,43,0.3);
  cursor:pointer;transition:border-color 0.2s,color 0.2s;color:inherit;}
.term-link:hover{border-bottom-color:#c0392b;color:#c0392b;}

/* ===== 角标 ===== */
.fn-ref{font-size:10px;color:#c0392b;cursor:pointer;vertical-align:super;
  font-family:'Noto Sans SC',system-ui,sans-serif;font-weight:600;
  margin-left:1px;transition:opacity 0.2s;}
.fn-ref:hover{opacity:0.7;}

/* ===== 右侧推挤面板 ===== */
.side-panel{position:fixed;top:52px;right:0;bottom:0;width:320px;
  background:#f5f0e8;border-left:0.5px solid rgba(26,26,26,0.1);
  transform:translateX(100%);
  transition:transform 0.35s cubic-bezier(0.4,0,0.2,1);
  z-index:90;display:flex;flex-direction:column;overflow:hidden;}
.side-panel.open{transform:translateX(0);}
/* 面板头部 */
.panel-header{display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px;border-bottom:0.5px solid rgba(26,26,26,0.08);flex-shrink:0;}
.panel-title{font-size:13px;letter-spacing:0.12em;color:#2c2420;
  font-family:'Noto Sans SC',system-ui,sans-serif;font-weight:600;}
.panel-close{width:28px;height:28px;border:none;background:none;cursor:pointer;
  font-size:18px;color:#a09080;display:flex;align-items:center;justify-content:center;
  border-radius:4px;transition:background 0.2s,color 0.2s;}
.panel-close:hover{background:rgba(26,26,26,0.06);color:#2c2420;}
/* 选项卡 */
.panel-tabs{display:flex;border-bottom:0.5px solid rgba(26,26,26,0.08);flex-shrink:0;}
.panel-tab{flex:1;padding:10px 0;text-align:center;font-size:11px;letter-spacing:0.14em;
  color:#a09080;cursor:pointer;border-bottom:2px solid transparent;
  font-family:'Noto Sans SC',system-ui,sans-serif;transition:color 0.2s,border-color 0.2s;}
.panel-tab:hover{color:#7a6e64;}
.panel-tab.active{color:#c0392b;border-bottom-color:#c0392b;}
.panel-tab.disabled{color:#d4c8b8;cursor:default;}
/* 面板内容 */
.panel-body{flex:1;overflow-y:auto;padding:20px;}
.panel-term{font-size:20px;letter-spacing:0.1em;color:#2c2420;margin-bottom:4px;}
.panel-pinyin{font-size:13px;color:#a09080;margin-bottom:16px;
  font-family:'Noto Sans SC',system-ui,sans-serif;}
.panel-meaning{font-size:14px;line-height:1.9;color:#5a4e44;letter-spacing:0.04em;}
.panel-placeholder{text-align:center;padding:40px 20px;color:#c8b8a4;
  font-size:12px;letter-spacing:0.1em;font-family:'Noto Sans SC',system-ui,sans-serif;}
/* 面板触发标签（收起状态时显示） */
.panel-trigger{position:fixed;right:0;top:50%;transform:translateY(-50%);
  width:28px;padding:12px 4px;background:rgba(237,232,220,0.9);
  border:0.5px solid rgba(26,26,26,0.08);border-right:none;
  border-radius:4px 0 0 4px;cursor:pointer;
  font-size:11px;color:#7a6e64;writing-mode:vertical-rl;letter-spacing:0.2em;
  font-family:'Noto Sans SC',system-ui,sans-serif;
  transition:background 0.2s,color 0.2s;z-index:89;
  box-shadow:-2px 0 8px rgba(26,26,26,0.04);}
.panel-trigger:hover{background:#ede8dc;color:#c0392b;}
.panel-trigger.hidden{opacity:0;pointer-events:none;}

/* ===== Prev/Next Navigation ===== */
.hex-nav{display:flex;justify-content:space-between;align-items:center;
  padding:32px 0;margin-top:16px;border-top:0.5px solid rgba(26,26,26,0.1);}
.hex-nav a{font-size:12px;letter-spacing:0.1em;color:#7a6e64;text-decoration:none;
  display:flex;align-items:center;gap:8px;font-family:'Noto Sans SC',system-ui,sans-serif;
  transition:color 0.2s;padding:8px 0;}
.hex-nav a:hover{color:#c0392b;}
.hex-nav .prev::before{content:'←';}
.hex-nav .next::after{content:'→';}
.hex-nav .nav-hex-name{font-family:'Noto Serif SC',serif;font-size:14px;}

/* ===== Footer ===== */
.site-footer{text-align:center;padding:24px;font-size:10px;letter-spacing:0.14em;
  color:#c8b8a4;border-top:0.5px solid rgba(26,26,26,0.06);
  font-family:'Noto Sans SC',system-ui,sans-serif;margin-top:auto;}
.site-footer a{color:#a09080;text-decoration:none;transition:color 0.2s;}
.site-footer a:hover{color:#c0392b;}

/* ===== Loading & Error ===== */
.loading{text-align:center;padding:120px 24px;font-size:13px;letter-spacing:0.12em;color:#a09080;}
.error-msg{text-align:center;padding:120px 24px;}
.error-msg h2{font-size:24px;color:#2c2420;margin-bottom:16px;}
.error-msg p{font-size:14px;color:#7a6e64;margin-bottom:24px;}
.error-msg a{color:#c0392b;text-decoration:none;font-size:13px;letter-spacing:0.1em;}

/* ===== Responsive ===== */
@media(max-width:768px){
  .hex-detail{flex-direction:column;gap:24px;padding:24px 16px;}
  .hex-sidebar{width:100%;position:static;padding:16px 0;
    border-bottom:0.5px solid rgba(26,26,26,0.08);padding-bottom:24px;}
  .section-text{font-size:16px;}
  .yaoci-text{font-size:15px;}
  .hex-nav{flex-direction:column;gap:16px;align-items:stretch;}
  .hex-nav a{justify-content:center;}
  .side-panel{width:100%;top:52px;}
  .panel-trigger{display:none;}
  body.panel-open .hex-detail{margin-right:0;}
}
</style>
</head>
<body>

<!-- ===== Auth Gate ===== -->
<div class="auth-gate" id="auth-gate">
  <div class="auth-logo">
    <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="100" cy="100" r="84" stroke="#5c3a30" stroke-width="5" fill="none"/>
      <line x1="100" y1="48" x2="100" y2="152" stroke="#2c2420" stroke-width="18" stroke-linecap="round"/>
      <line x1="48" y1="48" x2="100" y2="100" stroke="#2c2420" stroke-width="18" stroke-linecap="round"/>
      <line x1="152" y1="48" x2="152" y2="82" stroke="#c0392b" stroke-width="18" stroke-linecap="round"/>
      <line x1="152" y1="118" x2="152" y2="152" stroke="#c0392b" stroke-width="18" stroke-linecap="round"/>
    </svg>
  </div>
  <div class="auth-label">开发预览</div>
  <div class="auth-form">
    <input class="auth-input" id="auth-input" type="password" placeholder="请输入访问密码" autocomplete="off"/>
    <button class="auth-btn" id="auth-btn">进入</button>
    <div class="auth-error" id="auth-error">密码不正确</div>
  </div>
</div>

<!-- ===== Top Navigation ===== -->
<nav class="top-nav">
  <div class="nav-left">
    <a class="nav-back" href="/">六十四卦</a>
  </div>
  <a class="nav-logo" href="/">
    <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="100" cy="100" r="84" stroke="#5c3a30" stroke-width="5" fill="none"/>
      <line x1="100" y1="48" x2="100" y2="152" stroke="#2c2420" stroke-width="18" stroke-linecap="round"/>
      <line x1="48" y1="48" x2="100" y2="100" stroke="#2c2420" stroke-width="18" stroke-linecap="round"/>
      <line x1="152" y1="48" x2="152" y2="82" stroke="#c0392b" stroke-width="18" stroke-linecap="round"/>
      <line x1="152" y1="118" x2="152" y2="152" stroke="#c0392b" stroke-width="18" stroke-linecap="round"/>
    </svg>
  </a>
  <div class="nav-tools">
    <!-- 主题切换 -->
    <button class="nav-btn" id="theme-toggle" title="Toggle theme" onclick="toggleTheme()">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
        <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
      </svg>
    </button>
    <!-- 账户 -->
    <div class="nav-account">
      <button class="nav-btn" id="account-btn" title="Account" onclick="toggleAccountMenu()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </button>
      <div class="account-dropdown" id="account-dropdown">
        <div class="dropdown-header">Account</div>
        <a class="dropdown-item" onclick="closeAccountMenu()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
          </svg>
          Browsing History
        </a>
        <a class="dropdown-item" onclick="closeAccountMenu()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          AI API Key
        </a>
        <div class="dropdown-divider"></div>
        <a class="dropdown-item disabled">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>
          </svg>
          Notes (coming soon)
        </a>
        <a class="dropdown-item disabled">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="3"/><path d="M12 1v6m0 6v6m-7.07-3.93 4.24-4.24m5.66-5.66 4.24-4.24M1 12h6m6 0h6m-3.93 7.07-4.24-4.24M8.17 8.17 3.93 3.93"/>
          </svg>
          Settings (coming soon)
        </a>
      </div>
    </div>
  </div>
</nav>

<!-- ===== Main Content ===== -->
<main class="hex-detail" id="hex-detail">
  <div class="loading" id="loading">载入中...</div>
</main>

<!-- ===== Right Side Panel ===== -->
<div class="panel-trigger" id="panel-trigger" onclick="SidePanel.toggle()">释</div>
<div class="side-panel" id="side-panel">
  <div class="panel-header">
    <span class="panel-title" id="panel-title">词义解释</span>
    <button class="panel-close" onclick="SidePanel.close()">×</button>
  </div>
  <div class="panel-tabs">
    <div class="panel-tab active" data-tab="meaning" onclick="SidePanel.switchTab('meaning')">词义</div>
    <div class="panel-tab disabled" data-tab="ai" onclick="return false;">AI 解读（即将推出）</div>
  </div>
  <div class="panel-body" id="panel-body">
    <div class="panel-placeholder">点击经文中带下划线的词语<br>查看详细释义</div>
  </div>
</div>

<!-- ===== Footer ===== -->
<footer class="site-footer">
  爻卦易 · yaoguayi.com ·
  <a href="/">六十四卦</a> · 开源 · 非盈利 ·
  <a href="https://github.com/Hypocrite65/yaoguayi" target="_blank">GitHub</a> ·
  <a href="#" id="logout-link">退出预览</a>

<script>
/**
 * hexagram.html — 卦象详情页主逻辑
 *
 * 设计说明：
 * 双栏布局：左侧 sticky 卦象面板 + 右侧经文内容。
 * 自动为生僻字添加 ruby 注音，术语添加可点击下划线。
 * 右侧弹出面板显示词义解释，预留 AI 解读选项卡。
 */

/* ===== 全局状态 ===== */
let annotations = null;  // 注音和术语数据
let footnoteCounter = 0; // 全局角标计数器

/**
 * 主题切换（日间/夜间模式）
 * 设计说明：暂时只切换图标状态，后续实现完整的暗色主题 CSS 变量
 */
function toggleTheme() {
  const btn = document.getElementById('theme-toggle');
  const isDark = document.body.classList.toggle('dark-theme');
  localStorage.setItem('yaoguayi_theme', isDark ? 'dark' : 'light');
  // 切换图标：太阳 ↔ 月亮
  btn.innerHTML = isDark
    ? '<svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>'
    : '<svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>';
}
// 页面加载时恢复主题状态
if (localStorage.getItem('yaoguayi_theme') === 'dark') {
  document.body.classList.add('dark-theme');
  const btn = document.getElementById('theme-toggle');
  if (btn) btn.innerHTML = '<svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
}

/**
 * 账户下拉菜单切换
 * 设计说明：点击账户图标展开/收起下拉菜单，点击外部自动关闭
 */
function toggleAccountMenu() {
  const dropdown = document.getElementById('account-dropdown');
  dropdown.classList.toggle('show');
}
function closeAccountMenu() {
  document.getElementById('account-dropdown').classList.remove('show');
}
// 点击外部关闭下拉菜单
document.addEventListener('click', (e) => {
  const accountArea = document.querySelector('.nav-account');
  if (accountArea && !accountArea.contains(e.target)) {
    closeAccountMenu();
  }
});

/* ===== 初始化密码门 ===== */
YaoguayiAuth.init(() => {
  document.querySelectorAll('.fade-in').forEach(el => el.classList.add('visible'));
});

/* ===== 加载数据 ===== */
const params = new URLSearchParams(window.location.search);
const hexId = parseInt(params.get('id'), 10);

if (!hexId || hexId < 1 || hexId > 64) {
  showError('未找到该卦象', '请从六十四卦列表中选择');
} else {
  Promise.all([
    fetch('/data/hexagrams.json').then(r => r.json()),
    fetch('/data/annotations.json').then(r => r.json()).catch(() => null)
  ]).then(([hexagrams, annot]) => {
    annotations = annot;
    const hex = hexagrams.find(h => h.id === hexId);
    if (!hex) {
      showError('未找到第' + hexId + '卦', '数据可能尚未录入');
      return;
    }
    renderHexagram(hex, hexagrams);
  }).catch(err => {
    console.error(err);
    showError('数据加载失败', '请检查网络连接后重试');
  });
}

/**
 * 右侧面板模块
 * 设计说明：管理右侧弹出面板的展开/收起/内容切换
 */
const SidePanel = {
  el: document.getElementById('side-panel'),
  body: document.getElementById('panel-body'),
  trigger: document.getElementById('panel-trigger'),
  isOpen: false,

  open(term, data) {
    this.body.innerHTML = `
      <div class="panel-term">${data.term || term}</div>
      ${data.pinyin ? `<div class="panel-pinyin">${data.pinyin}</div>` : ''}
      <div class="panel-meaning">${data.meaning || '暂无释义'}</div>`;
    this.el.classList.add('open');
    this.trigger.classList.add('hidden');
    document.body.classList.add('panel-open');
    this.isOpen = true;
  },

  close() {
    this.el.classList.remove('open');
    this.trigger.classList.remove('hidden');
    document.body.classList.remove('panel-open');
    this.isOpen = false;
  },

  toggle() {
    if (this.isOpen) this.close();
    else {
      this.body.innerHTML = '<div class="panel-placeholder">点击经文中带下划线的词语<br>查看详细释义</div>';
      this.el.classList.add('open');
      this.trigger.classList.add('hidden');
      document.body.classList.add('panel-open');
      this.isOpen = true;
    }
  },

  switchTab(tab) {
    document.querySelectorAll('.panel-tab').forEach(t => t.classList.remove('active'));
    const el = document.querySelector(`.panel-tab[data-tab="${tab}"]`);
    if (el && !el.classList.contains('disabled')) el.classList.add('active');
  }
};

/**
 * 为文本添加注音和术语标注
 * 设计说明：
 *   1. 先将文本拆分为字符数组
 *   2. 优先匹配多字术语（glossary），添加可点击下划线
 *   3. 再对剩余字符匹配单字注音（pinyin），添加 ruby 标签
 *   避免在已标注的 HTML 标签内重复标注
 *
 * @param {string} text - 原始经文文本
 * @param {boolean} addTermLinks - 是否添加术语下划线链接
 * @returns {string} 带注音和标注的 HTML
 */
function annotateText(text, addTermLinks) {
  if (!annotations || !text) return text || '';

  // 收集所有需要标注的区间，避免重叠
  const marks = []; // {start, end, html}

  // 第一步：匹配术语（多字词优先）
  if (addTermLinks && annotations.glossary) {
    const terms = Object.keys(annotations.glossary).sort((a, b) => b.length - a.length);
    for (const term of terms) {
      let idx = 0;
      while ((idx = text.indexOf(term, idx)) !== -1) {
        // 检查是否与已有标记重叠
        const end = idx + term.length;
        const overlap = marks.some(m => !(end <= m.start || idx >= m.end));
        if (!overlap) {
          const g = annotations.glossary[term];
          const dataAttr = encodeURIComponent(JSON.stringify(g));
          marks.push({
            start: idx, end: end,
            html: `<span class="term-link" data-gloss="${dataAttr}" onclick="showGloss(this)">${term}</span>`
          });
        }
        idx = end;
      }
    }
  }

  // 第二步：匹配单字注音
  if (annotations.pinyin) {
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      const py = annotations.pinyin[ch];
      if (!py) continue;
      // 检查是否与已有标记重叠
      const overlap = marks.some(m => !(i + 1 <= m.start || i >= m.end));
      if (!overlap) {
        marks.push({
          start: i, end: i + 1,
          html: `<ruby>${ch}<rp>(</rp><rt>${py}</rt><rp>)</rp></ruby>`
        });
      }
    }
  }

  // 按位置排序，拼接结果
  marks.sort((a, b) => a.start - b.start);
  let result = '';
  let cursor = 0;
  for (const m of marks) {
    if (m.start > cursor) result += text.substring(cursor, m.start);
    result += m.html;
    cursor = m.end;
  }
  if (cursor < text.length) result += text.substring(cursor);

  return result;
}

/**
 * 显示术语释义（由 term-link 点击触发）
 * @param {HTMLElement} el - 被点击的术语元素
 */
function showGloss(el) {
  try {
    const data = JSON.parse(decodeURIComponent(el.dataset.gloss));
    SidePanel.open(data.term || el.textContent, data);
  } catch (e) {
    console.error('Failed to parse glossary data', e);
  }
}

/**
 * 渲染卦象详情到页面
 * @param {Object} hex - 卦象数据对象
 * @param {Array} all - 全部 64 卦数组
 */
function renderHexagram(hex, all) {
  document.title = hex.name + '卦 · 爻卦易';
  footnoteCounter = 0;

  const container = document.getElementById('hex-detail');
  const sym = String.fromCodePoint(0x4DBF + hex.id);

  const prevId = hex.id === 1 ? 64 : hex.id - 1;
  const nextId = hex.id === 64 ? 1 : hex.id + 1;
  const prevHex = all.find(h => h.id === prevId);
  const nextHex = all.find(h => h.id === nextId);

  // 构建爻辞列表
  let yaociHtml = '';
  if (hex.yaoci && hex.yaoci.length > 0) {
    yaociHtml = hex.yaoci.map(y => `
      <li class="yaoci-item" id="yao-${y.position}" data-position="${y.position}">
        <div class="yaoci-name">${y.name}</div>
        <div class="yaoci-text">${annotateText(y.text, true)}</div>
        ${y.text_trans ? `<div class="yaoci-trans">${y.text_trans}</div>` : ''}
        ${y.xiang ? `<div class="yaoci-xiang-label">小象传</div><div class="yaoci-xiang">${annotateText(y.xiang, false)}</div>` : ''}
        ${y.xiang_trans ? `<div class="yaoci-trans">${y.xiang_trans}</div>` : ''}
      </li>
    `).join('');
  }

  container.innerHTML = `
    <!-- 左侧 sticky 卦象面板 -->
    <aside class="hex-sidebar fade-in d1">
      <div class="sidebar-title">
        <span class="sidebar-name">${hex.name}</span>
        <span class="sidebar-pinyin">${hex.pinyin}</span>
      </div>
      <div class="sidebar-id">第${hex.id}卦</div>
      <div class="sidebar-lines">${buildLinesSVG(hex.lines, hex.yaoci)}</div>
      <div class="sidebar-trigrams">
        <span><span class="trigram-label">上卦</span>${hex.upperTrigram}</span>
        <span><span class="trigram-label">下卦</span>${hex.lowerTrigram}</span>
      </div>
    </aside>

    <!-- 右侧经文内容 -->
    <div class="hex-content">
      <!-- 卦辞 -->
      <div class="section fade-in d2">
        <div class="section-label">卦 辞</div>
        <div class="section-text">${annotateText(hex.guaci, true)}</div>
        ${hex.guaci_trans ? `<div class="section-trans">${hex.guaci_trans}</div>` : ''}
      </div>

      <!-- 彖传 -->
      ${hex.tuan ? `
      <div class="section fade-in d3">
        <div class="section-label">彖 传</div>
        <div class="section-text">${annotateText(hex.tuan, true)}</div>
        ${hex.tuan_trans ? `<div class="section-trans">${hex.tuan_trans}</div>` : ''}
      </div>` : ''}

      <!-- 大象传 -->
      ${hex.xiang ? `
      <div class="section fade-in d4">
        <div class="section-label">大 象 传</div>
        <div class="section-text">${annotateText(hex.xiang, true)}</div>
        ${hex.xiang_trans ? `<div class="section-trans">${hex.xiang_trans}</div>` : ''}
      </div>` : ''}

      <!-- 爻辞 -->
      ${yaociHtml ? `
      <div class="section fade-in d5">
        <div class="section-label">爻 辞</div>
        <ul class="yaoci-list">${yaociHtml}</ul>
      </div>` : ''}

      <!-- Prev/Next Navigation -->
      <div class="hex-nav fade-in d6">
        <a class="prev" href="/hexagram.html?id=${prevId}">
          <span class="nav-hex-name">${prevHex ? prevHex.name : ''}卦</span>
        </a>
        <a href="/" style="font-size:11px;letter-spacing:0.2em;color:#a09080;">六十四卦</a>
        <a class="next" href="/hexagram.html?id=${nextId}">
          <span class="nav-hex-name">${nextHex ? nextHex.name : ''}卦</span>
        </a>
      </div>
    </div>
  `;

  // 触发入场动画
  if (YaoguayiAuth.isAuthenticated()) {
    requestAnimationFrame(() => {
      container.querySelectorAll('.fade-in').forEach(el => el.classList.add('visible'));
    });
  }

}

/**
 * 生成带爻名标注的 SVG 六爻图
 * 设计说明：
 *   左侧绘制爻线，右侧标注对应爻名（初九、六二等）
 *   阳爻(1) = 实线，阴爻(0) = 断线
 *   由下至上排列（lines[0] 在底部）
 *
 * @param {number[]} lines - 六爻数组
 * @param {Array} yaoci - 爻辞数组（取 name 字段）
 * @returns {string} SVG HTML
 */
function buildLinesSVG(lines, yaoci) {
  /**
   * 生成大号 SVG 六爻图（含爻名标注）
   * 设计说明：
   *   左侧绘制爻线，右侧标注爻名（初九、六二等）
   *   尺寸放大以作为左侧面板的核心视觉元素
   */
  const lineW = 100;        // 爻线宽度
  const lineH = 8;          // 爻线高度
  const gap = 18;           // 爻间距（加大避免爻名文字重叠）
  const breakGap = 14;      // 阴爻断口宽度
  const textOffset = 12;    // 爻线右侧到文字的距离
  const totalH = 6 * lineH + 5 * gap;
  const x0 = 0;
  const svgW = lineW + textOffset + 36;

  let svgContent = '';
  for (let i = 0; i < 6; i++) {
    const lineIdx = 5 - i;
    const y = i * (lineH + gap);
    const val = lines[lineIdx];
    const yCenter = y + lineH / 2;

    if (val === 1) {
      svgContent += `<rect x="${x0}" y="${y}" width="${lineW}" height="${lineH}" rx="1.5" fill="#2c2420"/>`;
    } else {
      const segW = (lineW - breakGap) / 2;
      svgContent += `<rect x="${x0}" y="${y}" width="${segW}" height="${lineH}" rx="1.5" fill="#2c2420"/>`;
      svgContent += `<rect x="${x0 + segW + breakGap}" y="${y}" width="${segW}" height="${lineH}" rx="1.5" fill="#2c2420"/>`;
    }

    const pos = lineIdx + 1;
    const yao = yaoci ? yaoci.find(y => y.position === pos) : null;
    const label = yao ? yao.name : '';
    if (label && pos <= 6) {
      svgContent += `<a href="#yao-${pos}"><text x="${lineW + textOffset}" y="${yCenter + 4}" font-size="12" fill="#a09080" font-family="'Noto Sans SC',system-ui,sans-serif" style="cursor:pointer"><title>${label}</title>${label}</text></a>`;
    } else if (label) {
      svgContent += `<text x="${lineW + textOffset}" y="${yCenter + 4}" font-size="12" fill="#a09080" font-family="'Noto Sans SC',system-ui,sans-serif">${label}</text>`;
    }
  }

  return `<svg viewBox="0 0 ${svgW} ${totalH}" width="${svgW}" height="${totalH}" xmlns="http://www.w3.org/2000/svg">${svgContent}</svg>`;
}

/**
 * 显示错误页面
 */
function showError(title, desc) {
  const container = document.getElementById('hex-detail');
  container.innerHTML = `
    <div class="error-msg">
      <h2>${title}</h2>
      <p>${desc}</p>
      <a href="/">← 返回六十四卦</a>
    </div>`;
}
</script>
