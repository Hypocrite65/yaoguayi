<style>
/* index.html — nav initially hidden, shown on scroll */
.top-nav{opacity:0;transform:translateY(-100%);pointer-events:none;}
.top-nav.visible{opacity:1;transform:translateY(0);pointer-events:auto;
  transition:opacity 0.3s,transform 0.3s,background 0.4s;}

/* ===== Cover: full viewport ===== */
.cover{
  width:100%;min-height:100vh;
  display:flex;flex-direction:column;
  align-items:center;
  overflow:hidden;
  background:var(--bg);
}
.cover-inner{
  display:flex;flex-direction:column;align-items:center;
  flex:1;justify-content:center;
  transition:opacity 0.1s,transform 0.1s;
  will-change:opacity,transform;
}

/* Logo */
.cover-logo{margin-bottom:40px;display:flex;flex-direction:column;align-items:center;gap:16px;}
.cover-logo svg{width:72px;height:72px;}
.cover-brand{font-size:12px;letter-spacing:0.4em;color:var(--faint);
  font-family:'Noto Sans SC',system-ui,sans-serif;font-weight:500;}
.logo-circle{stroke-dasharray:530;stroke-dashoffset:530;
  animation:drawCircle 1.6s cubic-bezier(0.4,0,0.2,1) 0.2s forwards;}
.logo-line{opacity:0;animation:fadeInLine 0.6s cubic-bezier(0.4,0,0.2,1) forwards;}
.logo-l1{animation-delay:0.6s;}
.logo-l2{animation-delay:0.8s;}
.logo-l3{animation-delay:1.0s;}
.logo-l4{animation-delay:1.2s;}
@keyframes drawCircle{to{stroke-dashoffset:0;}}
@keyframes fadeInLine{from{opacity:0;transform:translateY(3px);}to{opacity:1;transform:translateY(0);}}

/* Title */
.cover-title{font-size:48px;letter-spacing:0.2em;color:var(--ink);
  font-weight:400;margin-bottom:36px;text-align:center;}

/* ===== Section navigation cards ===== */
.cover-sections{
  display:grid;grid-template-columns:repeat(4,1fr);gap:10px;
  width:min(520px, 85vw);margin-bottom:28px;
}
.section-link{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:16px 10px;
  border:0.5px solid var(--border);border-radius:6px;
  text-decoration:none;color:inherit;
  background:var(--card-bg);
  transition:background 0.3s,border-color 0.3s,box-shadow 0.3s,transform 0.25s;
}
.section-link:hover{
  transform:translateY(-2px);
  box-shadow:0 4px 16px var(--shadow);
  border-color:var(--border-strong);
}
.section-link-title{
  font-size:15px;font-weight:600;letter-spacing:0.1em;color:var(--ink);
}
.section-link-desc{
  font-size:10px;color:var(--muted);letter-spacing:0.04em;text-align:center;
  font-family:'Noto Sans SC',system-ui,sans-serif;
}

/* ===== Cover cards (daily / monthly) ===== */
.cover-cards{
  display:flex;flex-direction:column;gap:10px;
  width:min(520px, 85vw);margin-bottom:40px;
}
.cover-card{
  display:flex;align-items:center;gap:20px;
  padding:14px 24px;
  border:0.5px solid var(--border);border-radius:4px;
  cursor:pointer;text-decoration:none;color:inherit;
  background:var(--vermilion-faint);
  transition:background 0.35s,border-color 0.35s,box-shadow 0.35s,transform 0.25s;
}
.cover-card:hover{
  border-color:var(--vermilion-faint);
  box-shadow:0 2px 12px var(--shadow);transform:translateY(-2px);
}
.cover-card-sym{line-height:1;color:var(--vermilion);opacity:0.9;
  transition:opacity 0.3s,transform 0.3s;}
.cover-card:hover .cover-card-sym{opacity:1;transform:scale(1.08);}
.cover-card-info{display:flex;flex-direction:column;gap:3px;min-width:0;}
.cover-card-label{font-size:9px;letter-spacing:0.2em;color:var(--vermilion);
  font-family:'Noto Sans SC',system-ui,sans-serif;font-weight:600;}
.cover-card-name{font-size:16px;letter-spacing:0.12em;color:var(--ink);}
.cover-card-desc{font-size:10px;color:var(--muted);letter-spacing:0.06em;line-height:1.6;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cover-card-sub{font-size:10px;color:var(--faint);letter-spacing:0.08em;
  font-family:'Noto Sans SC',system-ui,sans-serif;}
.cover-card-arrow{margin-left:auto;font-size:14px;color:var(--ghost);flex-shrink:0;
  transition:transform 0.3s,color 0.3s;}
.cover-card:hover .cover-card-arrow{transform:translateX(6px);color:var(--vermilion);}
.cover-card-month{padding:10px 24px;background:var(--hover-bg);}
.cover-card-month .cover-card-name{font-size:13px;}
.cover-card-month .cover-card-label{font-size:8px;color:var(--faint);}
.cover-card-month .cover-card-sym{color:var(--ink);opacity:0.85;}

/* Quote at bottom */
.cover-quote{
  padding:20px 0;
  font-size:11px;letter-spacing:0.16em;color:var(--ghost);
  text-align:center;line-height:2.2;}
.cover-quote em{font-style:normal;font-size:10px;color:var(--whisper);}

/* ===== Responsive: short viewport ===== */
@media(max-height:800px){
  .cover-logo{margin-bottom:20px;gap:10px;}
  .cover-logo svg{width:56px;height:56px;}
  .cover-title{font-size:40px;margin-bottom:24px;}
  .cover-sections{margin-bottom:20px;gap:10px;}
  .section-link{padding:14px 18px;}
  .cover-cards{margin-bottom:20px;}
  .cover-quote{padding:10px 0;}
}

/* ===== Responsive: narrow width (mobile) ===== */
@media(max-width:768px){
  .cover-title{font-size:32px;}
  .cover-sections{grid-template-columns:repeat(2,1fr);width:min(360px,90vw);gap:10px;}
  .section-link{padding:14px 16px;}
  .section-link-title{font-size:14px;}
  .cover-cards{width:min(360px,90vw);}
  .cover-quote{padding:12px 0;}
}
</style>

<!-- ===== Cover ===== -->
<section class="cover">
  <div class="cover-inner">
    <div class="cover-logo fade-in d1">
      <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle class="logo-circle" cx="100" cy="100" r="84" stroke="#5c3a30" stroke-width="5" fill="none"/>
        <line class="logo-line logo-l1" x1="100" y1="48" x2="100" y2="152" stroke="#2c2420" stroke-width="18" stroke-linecap="round"/>

<script src="/js/search.js?v=1"></script>

<script>
YaoguayiAuth.init();
document.querySelectorAll('.cover .fade-in').forEach(el => el.classList.add('visible'));
if (typeof AdminPanel !== 'undefined') AdminPanel.init();

const MONTH_HEX = [
  { month: '丑月', id: 19, desc: '二阳渐长' },
  { month: '寅月', id: 11, desc: '三阳开泰' },
  { month: '卯月', id: 34, desc: '四阳壮盛' },
  { month: '辰月', id: 43, desc: '五阳决阴' },
  { month: '巳月', id: 1,  desc: '纯阳极盛' },
  { month: '午月', id: 44, desc: '一阴初生' },
  { month: '未月', id: 33, desc: '二阴渐长' },
  { month: '申月', id: 12, desc: '阴阳相隔' },
  { month: '酉月', id: 20, desc: '四阴盛行' },
  { month: '戌月', id: 23, desc: '五阴剥阳' },
  { month: '亥月', id: 2,  desc: '纯阴极盛' },
  { month: '子月', id: 24, desc: '一阳初生' }
];
const d = new Date();
const monthInfo = MONTH_HEX[d.getMonth()];

function getDailyHexId() {
  const str = d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
  let hash = 0;
  for (let i = 0; i < str.length; i++) {
    hash = ((hash << 5) - hash + str.charCodeAt(i)) | 0;
  }
  return (((hash % 64) + 64) % 64) + 1;
}
const dailyHexId = getDailyHexId();

function miniHexSVG(lines, size) {
  if (!lines || lines.length < 6) return '';
  const s = size || 28;
  const lw = s * 0.8, lh = s * 0.07, gap = s * 0.1, bg = s * 0.16;
  const th = 6 * lh + 5 * gap;
  const x0 = (s - lw) / 2;
  let svg = '';
  for (let i = 0; i < 6; i++) {
    const li = 5 - i, y = i * (lh + gap);
    if (lines[li] === 1) {
      svg += `<rect x="${x0}" y="${y}" width="${lw}" height="${lh}" rx="0.5" fill="currentColor"/>`;
    } else {
      const sw = (lw - bg) / 2;
      svg += `<rect x="${x0}" y="${y}" width="${sw}" height="${lh}" rx="0.5" fill="currentColor"/>`;
      svg += `<rect x="${x0 + sw + bg}" y="${y}" width="${sw}" height="${lh}" rx="0.5" fill="currentColor"/>`;
    }
  }
  return `<svg viewBox="0 0 ${s} ${th}" width="${s}" height="${th}" style="display:block" xmlns="http://www.w3.org/2000/svg">${svg}</svg>`;
}

fetch('/data/hexagrams.json?v=3')
  .then(r => r.json())
  .then(hexagrams => {
    const dailyCard = document.getElementById('daily-card');
    const monthCard = document.getElementById('month-card');
    if (dailyCard) {
      const dHex = hexagrams[dailyHexId - 1];
      const dateStr = d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日';
      const guaci = (dHex.guaci || '').replace(/^.*?[：:]/, '').slice(0, 30);
      dailyCard.innerHTML = `<span class="cover-card-sym">${miniHexSVG(dHex.lines, 42)}</span>
        <div class="cover-card-info">
          <span class="cover-card-label">每 日 一 卦</span>
          <span class="cover-card-name">第${dailyHexId}卦 · ${dHex.name}</span>
          <span class="cover-card-desc">${guaci}</span>
          <span class="cover-card-sub">${dateStr}</span>
        </div>
        <span class="cover-card-arrow">→</span>`;
      dailyCard.onclick = (e) => { e.preventDefault(); location.href = '/hexagram.html?id=' + dailyHexId; };
    }
    if (monthCard) {
      const mHex = hexagrams[monthInfo.id - 1];
      const solarMonth = d.getMonth() + 1;
      monthCard.innerHTML = `<span class="cover-card-sym">${miniHexSVG(mHex.lines, 28)}</span>
        <div class="cover-card-info">
          <span class="cover-card-label">本 月 卦 象</span>
          <span class="cover-card-name">第${monthInfo.id}卦 · ${mHex.name}</span>
          <span class="cover-card-sub">${monthInfo.month} · ${solarMonth}月 · ${monthInfo.desc}</span>
        </div>
        <span class="cover-card-arrow">→</span>`;
      monthCard.onclick = (e) => { e.preventDefault(); location.href = '/hexagram.html?id=' + monthInfo.id; };
    }
  })
  .catch(() => {});

/* Cover parallax + nav show/hide */
const coverInner = document.querySelector('.cover-inner');
const topNav = document.getElementById('top-nav');
window.addEventListener('scroll', () => {
  const scrollY = window.scrollY;
  const vh = window.innerHeight;
  const progress = Math.min(scrollY / (vh * 0.5), 1);
  if (coverInner) {
    coverInner.style.opacity = 1 - progress;
    coverInner.style.transform = 'translateY(' + (-scrollY * 0.3) + 'px)';
  }
  if (topNav) {
    if (scrollY > vh * 0.7) topNav.classList.add('visible');
    else topNav.classList.remove('visible');
  }
}, { passive: true });
</script>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js');</script>
</body>
