<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>爻卦易 · 观象明理</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}

/* ===== 主题变量 ===== */
body{
  --bg:#f5f0e8;--bg-alt:#ede8dc;--ink:#2c2420;--ink-light:#5a4e44;
  --muted:#7a6e64;--faint:#a09080;--ghost:#c8b8a4;--whisper:#d4c8b8;
  --border:rgba(26,26,26,0.08);--border-strong:rgba(26,26,26,0.15);
  --vermilion:#c0392b;--vermilion-faint:rgba(192,57,43,0.15);
  --nav-bg:rgba(245,240,232,0.92);--card-bg:rgba(237,232,220,0.5);
  --hover-bg:rgba(26,26,26,0.06);--shadow:rgba(26,26,26,0.08);
  --svg-fill:#2c2420;--svg-circle:#5c3a30;
}
body.dark-theme{
  --bg:#1c1a16;--bg-alt:#252320;--ink:#e8e0d4;--ink-light:#ccc4b8;
  --muted:#a49c8c;--faint:#847c6c;--ghost:#5a5448;--whisper:#3e3830;
  --border:rgba(232,224,212,0.10);--border-strong:rgba(232,224,212,0.18);
  --vermilion:#e07060;--vermilion-faint:rgba(224,112,96,0.18);
  --nav-bg:rgba(28,26,22,0.94);--card-bg:rgba(37,35,32,0.7);
  --hover-bg:rgba(232,224,212,0.08);--shadow:rgba(0,0,0,0.3);
  --svg-fill:#e8e0d4;--svg-circle:#a07860;
}

body{font-family:'Noto Serif SC','STSong','SimSun','Georgia',serif;
  color:var(--ink);background:var(--bg);overflow-x:hidden;
  transition:background 0.4s,color 0.4s;}

/* ===== 顶部导航栏 ===== */
.top-nav{position:fixed;top:0;left:0;right:0;z-index:200;
  background:var(--nav-bg);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border-bottom:0.5px solid var(--border);padding:10px 24px;
  display:flex;align-items:center;justify-content:space-between;
  font-family:'Noto Sans SC',system-ui,sans-serif;transition:background 0.4s;
  opacity:0;transform:translateY(-100%);pointer-events:none;}
.top-nav.visible{opacity:1;transform:translateY(0);pointer-events:auto;
  transition:opacity 0.3s,transform 0.3s,background 0.4s;}
.nav-left{display:flex;align-items:center;gap:16px;}
.nav-home{font-size:13px;letter-spacing:0.1em;color:var(--muted);text-decoration:none;
  display:flex;align-items:center;gap:6px;transition:color 0.2s;}
.nav-home:hover{color:var(--vermilion);}
.nav-logo{display:flex;align-items:center;gap:8px;text-decoration:none;}
.nav-logo svg{width:28px;height:28px;}
.nav-logo svg circle{stroke:var(--svg-circle);}
.nav-logo svg line{stroke:var(--svg-fill);}
.nav-logo svg line:nth-child(4),.nav-logo svg line:nth-child(5){stroke:var(--vermilion);}
.nav-tools{display:flex;align-items:center;gap:4px;}
.nav-btn{width:32px;height:32px;border:none;background:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;border-radius:6px;
  color:var(--muted);transition:background 0.2s,color 0.2s;}
.nav-btn:hover{background:var(--hover-bg);color:var(--ink);}
.nav-btn svg{width:18px;height:18px;}
.nav-account{position:relative;}
.account-dropdown{position:absolute;top:calc(100% + 8px);right:0;width:200px;
  background:var(--bg);border:0.5px solid var(--border-strong);
  border-radius:6px;box-shadow:0 4px 20px var(--shadow);
  opacity:0;transform:translateY(-4px);pointer-events:none;
  transition:opacity 0.25s,transform 0.25s;z-index:210;}
.account-dropdown.show{opacity:1;transform:translateY(0);pointer-events:auto;}
.dropdown-header{padding:12px 16px;border-bottom:0.5px solid var(--border);
  font-size:11px;letter-spacing:0.1em;color:var(--faint);}
.dropdown-item{display:flex;align-items:center;gap:10px;
  padding:10px 16px;font-size:12px;letter-spacing:0.06em;color:var(--ink-light);
  cursor:pointer;transition:background 0.15s,color 0.15s;text-decoration:none;}
.dropdown-item:hover{background:var(--hover-bg);color:var(--vermilion);}
.dropdown-item svg{width:16px;height:16px;color:var(--faint);flex-shrink:0;}
.dropdown-item:hover svg{color:var(--vermilion);}
.dropdown-item.disabled{color:var(--ghost);cursor:default;}
.dropdown-item.disabled:hover{background:none;color:var(--ghost);}
.dropdown-item.disabled svg{color:var(--whisper);}
.dropdown-divider{height:0.5px;background:var(--border);margin:4px 0;}

/* ===== Scroll-triggered fade-in ===== */
.fade-in{opacity:0;transform:translateY(24px);transition:opacity 0.8s cubic-bezier(0.25,0.46,0.45,0.94),transform 0.8s cubic-bezier(0.25,0.46,0.45,0.94);}
.fade-in.visible{opacity:1;transform:translateY(0);}
/* Stagger delays for cover elements */
.fade-in.d1{transition-delay:0.1s;}
.fade-in.d2{transition-delay:0.25s;}
.fade-in.d3{transition-delay:0.4s;}
.fade-in.d4{transition-delay:0.55s;}
.fade-in.d5{transition-delay:0.7s;}

/* ===== Cover: full viewport ===== */
.cover{
  width:100%;height:100vh;
  display:flex;flex-direction:column;
  justify-content:center;align-items:center;
  position:relative;
  background:var(--bg);
}

/* Cover parallax: content fades out + drifts up on scroll */
.cover-inner{
  display:flex;flex-direction:column;align-items:center;
  transition:opacity 0.1s,transform 0.1s;
  will-change:opacity,transform;
}

/* Logo */
.cover-logo{margin-bottom:48px;display:flex;flex-direction:column;align-items:center;gap:16px;}
.cover-logo svg{width:72px;height:72px;}
.cover-brand{font-size:12px;letter-spacing:0.4em;color:var(--faint);
  font-family:'Noto Sans SC',system-ui,sans-serif;font-weight:500;}
/* Logo circle draw animation */
.logo-circle{stroke-dasharray:530;stroke-dashoffset:530;
  animation:drawCircle 1.6s cubic-bezier(0.4,0,0.2,1) 0.2s forwards;}
.logo-line{opacity:0;animation:fadeInLine 0.6s cubic-bezier(0.4,0,0.2,1) forwards;}
.logo-l1{animation-delay:0.6s;}
.logo-l2{animation-delay:0.8s;}
.logo-l3{animation-delay:1.0s;}
.logo-l4{animation-delay:1.2s;}
@keyframes drawCircle{to{stroke-dashoffset:0;}}
@keyframes fadeInLine{from{opacity:0;transform:translateY(3px);}to{opacity:1;transform:translateY(0);}}

/* Title */
.cover-title{font-size:48px;letter-spacing:0.2em;color:var(--ink);
  font-weight:400;margin-bottom:20px;text-align:center;}
.cover-sub{font-size:13px;letter-spacing:0.12em;color:var(--muted);
  line-height:2.2;text-align:center;margin-bottom:44px;}

/* Navigation row */
.cover-nav{display:flex;gap:32px;margin-bottom:56px;}
.cover-nav a{font-size:11px;letter-spacing:0.18em;color:var(--muted);
  text-decoration:none;
  font-family:'Noto Sans SC',system-ui,sans-serif;font-weight:500;
  padding-bottom:2px;border-bottom:0.5px solid transparent;
  transition:color 0.3s,border-color 0.3s,transform 0.2s;}
.cover-nav a:hover{color:var(--vermilion);border-bottom-color:var(--vermilion);transform:translateY(-1px);}

/* Quote at bottom */
.cover-quote{position:absolute;bottom:80px;
  font-size:11px;letter-spacing:0.16em;color:var(--ghost);
  text-align:center;line-height:2.2;}
.cover-quote em{font-style:normal;font-size:10px;color:var(--whisper);}

/* Random hexagram card */
.random-card{
  display:flex;align-items:center;gap:20px;
  padding:14px 24px;margin-bottom:48px;
  width:min(400px, 85vw);
  border:0.5px solid var(--border);border-radius:4px;
  cursor:pointer;text-decoration:none;color:inherit;
  background:var(--card-bg);
  transition:background 0.35s,border-color 0.35s,box-shadow 0.35s,transform 0.25s;
}
.random-card:hover{
  background:var(--bg-alt);border-color:var(--vermilion-faint);
  box-shadow:0 2px 12px var(--shadow);transform:translateY(-2px);
}
.random-sym{font-size:36px;line-height:1;color:var(--ink);opacity:0.75;
  transition:opacity 0.3s,transform 0.3s;}
.random-card:hover .random-sym{opacity:1;transform:scale(1.08);}
.random-info{display:flex;flex-direction:column;gap:3px;}
.random-label{font-size:9px;letter-spacing:0.2em;color:var(--vermilion);
  font-family:'Noto Sans SC',system-ui,sans-serif;font-weight:600;}
.random-name{font-size:16px;letter-spacing:0.12em;color:var(--ink);}
.random-guaci{font-size:10px;color:var(--muted);letter-spacing:0.06em;line-height:1.6;}
.random-month{font-size:10px;color:var(--faint);letter-spacing:0.08em;
  font-family:'Noto Sans SC',system-ui,sans-serif;}
.random-arrow{margin-left:auto;font-size:14px;color:var(--ghost);
  transition:transform 0.3s,color 0.3s;}
.random-card:hover .random-arrow{transform:translateX(6px);color:var(--vermilion);}

/* Scroll hint */
.scroll-hint{position:absolute;bottom:32px;
  display:flex;flex-direction:column;align-items:center;gap:6px;
  color:var(--ghost);font-size:9px;letter-spacing:0.2em;
  animation:hintPulse 2.5s ease-in-out infinite;
  transition:opacity 0.4s;}
.scroll-hint.hidden{opacity:0;pointer-events:none;}
.scroll-hint::after{content:'';width:1px;height:20px;background:var(--ghost);
  animation:hintLine 2.5s ease-in-out infinite;}
@keyframes hintPulse{0%,100%{opacity:0.4;}50%{opacity:0.8;}}
@keyframes hintLine{0%,100%{height:16px;opacity:0.3;}50%{height:24px;opacity:0.7;}}

/* ===== Divider ===== */
.section-divider{
  width:100%;padding:20px 20%;
  display:flex;align-items:center;gap:20px;
  background:linear-gradient(to bottom,var(--bg),var(--bg-alt));
}
.section-divider::before,.section-divider::after{
  content:'';flex:1;height:0.5px;background:var(--border);
}
.section-divider span{font-size:10px;letter-spacing:0.3em;color:var(--ghost);
  white-space:nowrap;
  font-family:'Noto Sans SC',system-ui,sans-serif;}

/* ===== Hexagram Section ===== */
.hex-section{
  background:var(--bg-alt);
  padding:40px 32px 24px;
  min-height:100vh;transition:background 0.4s;
}
.hex-header{
  max-width:960px;margin:0 auto 20px;
  display:flex;align-items:baseline;justify-content:space-between;
}
.hex-title{font-size:11px;letter-spacing:0.22em;color:var(--faint);
  font-family:'Noto Sans SC',system-ui,sans-serif;font-weight:500;}
.hex-hint{font-size:10px;letter-spacing:0.12em;color:var(--ghost);}

/* Grid */
.hex-grid{
  max-width:960px;margin:0 auto;
  display:grid;grid-template-columns:repeat(8,1fr);gap:2px;
}
.hex-cell{
  display:flex;flex-direction:column;align-items:center;
  padding:12px 4px;cursor:pointer;border-radius:3px;
  transition:background 0.2s,transform 0.2s,box-shadow 0.2s;
  /* Staggered entrance */
  opacity:0;transform:translateY(16px);
}
.hex-cell.show{opacity:1;transform:translateY(0);
  transition:opacity 0.5s cubic-bezier(0.25,0.46,0.45,0.94),
    transform 0.5s cubic-bezier(0.25,0.46,0.45,0.94),
    background 0.2s,box-shadow 0.2s;}
.hex-cell:hover{background:var(--hover-bg);transform:scale(1.06);
  box-shadow:0 2px 8px var(--shadow);}
.hex-cell.today{background:var(--vermilion-faint);}
.hex-sym{font-size:22px;line-height:1;color:var(--ink);opacity:0.65;margin-bottom:5px;
  transition:opacity 0.2s,transform 0.3s;}
.hex-cell:hover .hex-sym{opacity:0.9;transform:scale(1.1);}
.hex-cell.today .hex-sym{color:var(--vermilion);opacity:0.9;}
.hex-name{font-size:11px;letter-spacing:0.08em;color:var(--ink-light);
  transition:color 0.2s;}
.hex-cell:hover .hex-name{color:var(--ink);}
.hex-cell.today .hex-name{color:var(--vermilion);}
.hex-num{font-size:8px;color:var(--ghost);margin-top:3px;}

/* Footer */
.site-footer{
  background:var(--bg-alt);padding:20px 32px;
  border-top:0.5px solid var(--border);
  font-size:9px;letter-spacing:0.14em;color:var(--ghost);
  font-family:'Noto Sans SC',system-ui,sans-serif;transition:background 0.4s;
}
.footer-row{display:flex;justify-content:space-between;align-items:center;
  max-width:960px;margin:0 auto;gap:12px;flex-wrap:wrap;}
.footer-left{display:flex;align-items:center;gap:6px;}
.footer-right{display:flex;align-items:center;gap:6px;}
.footer-sep{color:var(--whisper);}
.site-footer a{color:var(--vermilion);text-decoration:none;transition:color 0.2s;}
.site-footer a:hover{color:var(--muted);text-decoration:underline;}
@media(max-width:768px){
  .footer-row{flex-direction:column;align-items:center;text-align:center;gap:6px;}
  .footer-left,.footer-right{justify-content:center;flex-wrap:wrap;}
}

/* ===== Scrollbar ===== */
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(26,26,26,0.1);border-radius:3px;}
::-webkit-scrollbar-thumb:hover{background:rgba(26,26,26,0.2);}

/* ===== Auth Gate ===== */
.auth-gate{
  position:fixed;top:0;left:0;width:100%;height:100%;
  z-index:9999;background:var(--bg);
  display:flex;flex-direction:column;
  justify-content:center;align-items:center;
  transition:opacity 0.6s cubic-bezier(0.25,0.46,0.45,0.94),
    transform 0.6s cubic-bezier(0.25,0.46,0.45,0.94);
}
.auth-gate.hidden{opacity:0;pointer-events:none;transform:scale(1.02);}
.auth-gate.removed{display:none;}
.auth-logo{margin-bottom:32px;}
.auth-logo svg{width:56px;height:56px;}
.auth-label{font-size:9px;letter-spacing:0.3em;color:var(--vermilion);
  margin-bottom:28px;
  font-family:'Noto Sans SC',system-ui,sans-serif;font-weight:600;}
.auth-form{display:flex;flex-direction:column;align-items:center;gap:14px;}
.auth-input{
  width:240px;padding:10px 16px;
  border:0.5px solid var(--border-strong);border-radius:3px;
  background:var(--card-bg);
  font-family:'Noto Serif SC',serif;font-size:13px;letter-spacing:0.08em;
  color:var(--ink);outline:none;text-align:center;
  transition:border-color 0.3s,box-shadow 0.3s;
}
.auth-input:focus{border-color:rgba(192,57,43,0.3);
  box-shadow:0 0 0 3px rgba(192,57,43,0.06);}
.auth-input::placeholder{color:#c8b8a4;letter-spacing:0.12em;}
.auth-btn{
  width:240px;padding:10px 0;
  border:none;border-radius:3px;cursor:pointer;
  background:#2c2420;color:#f5f0e8;
  font-family:'Noto Sans SC',system-ui,sans-serif;
  font-size:11px;letter-spacing:0.18em;font-weight:500;
  transition:background 0.3s,transform 0.2s;
}
.auth-btn:hover{background:#3d3630;transform:translateY(-1px);}
.auth-btn:active{transform:translateY(0);}
.auth-error{font-size:10px;color:#c0392b;letter-spacing:0.1em;
  opacity:0;transition:opacity 0.3s;height:16px;
  font-family:'Noto Sans SC',system-ui,sans-serif;}
.auth-error.show{opacity:1;}
.auth-footer{position:absolute;bottom:40px;
  font-size:9px;letter-spacing:0.16em;color:#d4c8b8;}

/* ===== Responsive ===== */
@media(max-width:768px){
  .cover-title{font-size:32px;}
  .cover-nav{gap:20px;flex-wrap:wrap;justify-content:center;}
  .cover-quote{position:static;margin-top:40px;}
  .scroll-hint{position:static;margin-top:24px;}
  .hex-grid{grid-template-columns:repeat(4,1fr);}
  .hex-section{padding:28px 16px 16px;}
}
</style>
</head>
<body>

<!-- ===== Auth Gate ===== -->
<div class="auth-gate" id="auth-gate">
  <div class="auth-logo">
    <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="100" cy="100" r="84" stroke="#5c3a30" stroke-width="5" fill="none"/>
      <line x1="100" y1="48" x2="100" y2="152" stroke="#2c2420" stroke-width="18" stroke-linecap="round"/>
      <line x1="48" y1="48" x2="100" y2="100" stroke="#2c2420" stroke-width="18" stroke-linecap="round"/>
      <line x1="152" y1="48" x2="152" y2="82" stroke="#c0392b" stroke-width="18" stroke-linecap="round"/>
      <line x1="152" y1="118" x2="152" y2="152" stroke="#c0392b" stroke-width="18" stroke-linecap="round"/>
    </svg>
  </div>
  <div class="auth-label">开发预览</div>
  <div class="auth-form">
    <input class="auth-input" id="auth-input" type="password" placeholder="请输入访问密码" autocomplete="off"/>
    <button class="auth-btn" id="auth-btn">进入</button>
    <div class="auth-error" id="auth-error">密码不正确</div>
  </div>
  <div class="auth-footer">爻卦易 · 内部预览</div>
</div>

<!-- ===== Top Nav (appears on scroll) ===== -->
<nav class="top-nav" id="top-nav">
  <div class="nav-left">
    <a class="nav-home" href="#hexagrams">六十四卦</a>
  </div>
  <a class="nav-logo" href="/">
    <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="100" cy="100" r="84" stroke="#5c3a30" stroke-width="5" fill="none"/>
      <line x1="100" y1="48" x2="100" y2="152" stroke="#2c2420" stroke-width="18" stroke-linecap="round"/>
      <line x1="48" y1="48" x2="100" y2="100" stroke="#2c2420" stroke-width="18" stroke-linecap="round"/>
      <line x1="152" y1="48" x2="152" y2="82" stroke="#c0392b" stroke-width="18" stroke-linecap="round"/>
      <line x1="152" y1="118" x2="152" y2="152" stroke="#c0392b" stroke-width="18" stroke-linecap="round"/>
    </svg>
  </a>
  <div class="nav-tools">
    <button class="nav-btn" id="theme-toggle" title="Toggle theme" onclick="toggleTheme()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
        <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
      </svg>
    </button>
    <div class="nav-account">
      <button class="nav-btn" id="account-btn" title="Account" onclick="toggleAccountMenu()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
        </svg>
      </button>
      <div class="account-dropdown" id="account-dropdown">
        <div class="dropdown-header">Account</div>
        <a class="dropdown-item" onclick="closeAccountMenu()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          Browsing History
        </a>
        <a class="dropdown-item" onclick="closeAccountMenu()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          AI API Key
        </a>
        <div class="dropdown-divider"></div>
        <a class="dropdown-item disabled">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
          Notes (coming soon)
        </a>
        <a class="dropdown-item disabled">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 1v6m0 6v6m-7.07-3.93 4.24-4.24m5.66-5.66 4.24-4.24M1 12h6m6 0h6m-3.93 7.07-4.24-4.24M8.17 8.17 3.93 3.93"/></svg>
          Settings (coming soon)
        </a>
      </div>
    </div>
  </div>
</nav>

<!-- ===== First Screen: Cover ===== -->
<section class="cover">
  <div class="cover-inner">
    <!-- Logo with draw animation -->
    <div class="cover-logo fade-in d1">
      <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle class="logo-circle" cx="100" cy="100" r="84" stroke="#5c3a30" stroke-width="5" fill="none"/>

<script src="/js/theme.js"></script>
<script src="/js/auth.js"></script>
<script>
/**
 * index.html — 首页主逻辑
 *
 * 设计说明：
 * 从 hexagrams.json 加载完整卦象数据，渲染随机卦卡片和 64 卦网格。
 * 点击卦象跳转到详情页 hexagram.html?id=N。
 * 密码门由共享模块 auth.js 处理。
 */

/* 初始化密码门 */
YaoguayiAuth.init(() => {
  document.querySelectorAll('.cover .fade-in').forEach(el => el.classList.add('visible'));
});

/**
 * 十二消息卦（辟卦）— 月卦映射
 * 设计说明：
 *   源自汉代孟喜、京房卦气说，以十二卦对应十二地支月，
 *   反映一年中阴阳消长的自然规律。
 *   此处用阳历月份近似对应传统地支月份。
 */
const MONTH_HEX = [
  /* 阳历月: 地支月, 卦ID, 卦名, 阴阳特征 */
  /* 0=Jan */ { month: '丑月', id: 19, desc: '二阳渐长' },
  /* 1=Feb */ { month: '寅月', id: 11, desc: '三阳开泰' },
  /* 2=Mar */ { month: '卯月', id: 34, desc: '四阳壮盛' },
  /* 3=Apr */ { month: '辰月', id: 43, desc: '五阳决阴' },
  /* 4=May */ { month: '巳月', id: 1,  desc: '纯阳极盛' },
  /* 5=Jun */ { month: '午月', id: 44, desc: '一阴初生' },
  /* 6=Jul */ { month: '未月', id: 33, desc: '二阴渐长' },
  /* 7=Aug */ { month: '申月', id: 12, desc: '阴阳相隔' },
  /* 8=Sep */ { month: '酉月', id: 20, desc: '四阴盛行' },
  /* 9=Oct */ { month: '戌月', id: 23, desc: '五阴剥阳' },
  /* 10=Nov */{ month: '亥月', id: 2,  desc: '纯阴极盛' },
  /* 11=Dec */{ month: '子月', id: 24, desc: '一阳初生' }
];
const d = new Date();
const monthInfo = MONTH_HEX[d.getMonth()];
const monthHexId = monthInfo.id;

/* 加载卦象数据并渲染页面 */
fetch('/data/hexagrams.json?v=2')
  .then(r => r.json())
  .then(hexagrams => {
    renderRandomCard(hexagrams);
    renderGrid(hexagrams);
    initScrollAnimations();
  })
  .catch(err => {
    console.error('Failed to load hexagram data:', err);
    /* 降级：使用 Unicode 符号和卦名渲染基础网格 */
    renderFallbackGrid();
    initScrollAnimations();
  });

/**
 * 生成小型 SVG 卦象图标（替代 Unicode 字符，跨平台一致）
 * 设计说明：
 *   阳爻(1)=实线，阴爻(0)=断线，由下至上排列。
 *   用 currentColor 跟随主题颜色。
 * @param {number[]} lines - 六爻数组
 * @param {number} size - 图标尺寸(px)
 * @returns {string} SVG HTML
 */
function miniHexSVG(lines, size) {
  if (!lines || lines.length < 6) return '';
  const s = size || 28;
  const lw = s * 0.8;       // 爻线宽度
  const lh = s * 0.07;      // 爻线高度
  const gap = s * 0.1;      // 爻间距
  const bg = s * 0.16;      // 阴爻断口
  const th = 6 * lh + 5 * gap;
  const x0 = (s - lw) / 2;
  let svg = '';
  for (let i = 0; i < 6; i++) {
    const li = 5 - i;
    const y = i * (lh + gap);
    if (lines[li] === 1) {
      svg += `<rect x="${x0}" y="${y}" width="${lw}" height="${lh}" rx="0.5" fill="currentColor"/>`;
    } else {
      const sw = (lw - bg) / 2;
      svg += `<rect x="${x0}" y="${y}" width="${sw}" height="${lh}" rx="0.5" fill="currentColor"/>`;
      svg += `<rect x="${x0 + sw + bg}" y="${y}" width="${sw}" height="${lh}" rx="0.5" fill="currentColor"/>`;
    }
  }
  return `<svg viewBox="0 0 ${s} ${th}" width="${s}" height="${th}" style="display:block" xmlns="http://www.w3.org/2000/svg">${svg}</svg>`;
}

/**
 * 渲染本月消息卦卡片
 * 设计说明：基于十二消息卦体系，展示当月对应卦象及阴阳消长特征
 * @param {Array} hexagrams - 64 卦数据数组
 */
function renderRandomCard(hexagrams) {
  const rHex = hexagrams[monthHexId - 1];
  const rCard = document.getElementById('random-card');
  if (!rCard) return;
  const solarMonth = d.getMonth() + 1;
  rCard.innerHTML = `<span class="random-sym">${miniHexSVG(rHex.lines, 42)}</span>
    <div class="random-info">
      <span class="random-label">本 月 卦 象</span>
      <span class="random-name">第${monthHexId}卦 · ${rHex.name}</span>
      <span class="random-month">${monthInfo.month} · ${solarMonth}月 · ${monthInfo.desc}</span>
    </div>
    <span class="random-arrow">→</span>`;
  rCard.onclick = (e) => {
    e.preventDefault();
    location.href = '/hexagram.html?id=' + monthHexId;
  };
}

/**
 * 渲染 64 卦网格
 * @param {Array} hexagrams - 64 卦数据数组
 */
function renderGrid(hexagrams) {
  const grid = document.getElementById('hex-grid');
  if (!grid) return;
  hexagrams.forEach((hex) => {
    const id = hex.id;
    const sym = String.fromCodePoint(0x4DBF + id);
    const cell = document.createElement('div');
    cell.className = 'hex-cell' + (id === monthHexId ? ' today' : '');
    cell.innerHTML = `<span class="hex-sym">${sym}</span>
      <span class="hex-name">${hex.name}</span>
      <span class="hex-num">${id}</span>`;
    cell.onclick = () => { location.href = '/hexagram.html?id=' + id; };
    grid.appendChild(cell);
  });
}

/**
 * 降级网格：数据加载失败时使用卦名常量渲染
 */
function renderFallbackGrid() {
  const names = ['乾','坤','屯','蒙','需','讼','师','比','小畜','履','泰','否',
    '同人','大有','谦','豫','随','蛊','临','观','噬嗑','贲','剥','复',
    '无妄','大畜','颐','大过','坎','离','咸','恒','遁','大壮','晋','明夷',
    '家人','睽','蹇','解','损','益','夬','姤','萃','升','困','井',
    '革','鼎','震','艮','渐','归妹','丰','旅','巽','兑','涣','节',
    '中孚','小过','既济','未济'];
  const grid = document.getElementById('hex-grid');
  if (!grid) return;
  names.forEach((name, i) => {
    const id = i + 1;
    const sym = String.fromCodePoint(0x4DBF + id);
    const cell = document.createElement('div');
    cell.className = 'hex-cell' + (id === monthHexId ? ' today' : '');
    cell.innerHTML = `<span class="hex-sym">${sym}</span>
      <span class="hex-name">${name}</span>
      <span class="hex-num">${id}</span>`;
    cell.onclick = () => { location.href = '/hexagram.html?id=' + id; };
    grid.appendChild(cell);
  });
}

/**
 * 初始化滚动触发动画和封面视差效果
 */
function initScrollAnimations() {
  const grid = document.getElementById('hex-grid');

  /* IntersectionObserver: 滚动触发淡入 */
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        if (entry.target.classList.contains('hex-cell') && grid) {
          const idx = Array.from(grid.children).indexOf(entry.target);
          const row = Math.floor(idx / 8);
          const col = idx % 8;
          entry.target.style.transitionDelay = (row * 0.04 + col * 0.02) + 's';
          entry.target.classList.add('show');
        } else {
          entry.target.classList.add('visible');
        }
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });

  document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));
  document.querySelectorAll('.hex-cell').forEach(el => observer.observe(el));

  /* 封面视差：滚动时淡出上移 + 导航栏显示控制 */
  const coverInner = document.querySelector('.cover-inner');
  const scrollHint = document.getElementById('scroll-hint');
  const topNav = document.getElementById('top-nav');

  window.addEventListener('scroll', () => {
    const scrollY = window.scrollY;
    const vh = window.innerHeight;
    const progress = Math.min(scrollY / (vh * 0.5), 1);
    if (coverInner) {
      coverInner.style.opacity = 1 - progress;
      coverInner.style.transform = 'translateY(' + (-scrollY * 0.3) + 'px)';
    }
    if (scrollHint) {
      if (scrollY > 20) scrollHint.classList.add('hidden');
      else scrollHint.classList.remove('hidden');
    }
    /* 滚过封面后显示顶部导航栏 */
    if (topNav) {
      if (scrollY > vh * 0.7) topNav.classList.add('visible');
      else topNav.classList.remove('visible');
    }
  }, { passive: true });
}
</script>
</body>
