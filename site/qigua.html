<style>
html{scroll-padding-top:64px;}

.qigua-page{max-width:600px;margin:0 auto;padding:80px 24px 48px;min-height:100vh;}

/* Intro */
.qg-intro{text-align:center;margin-bottom:40px;}
.qg-intro-icon{font-size:48px;margin-bottom:12px;display:block;}
.qg-intro h1{font-size:24px;font-weight:700;letter-spacing:0.08em;margin-bottom:8px;}
.qg-intro p{font-size:13px;color:var(--muted);line-height:1.8;max-width:420px;margin:0 auto 24px;}
.qg-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
.qg-btn{padding:10px 28px;border-radius:6px;font-size:14px;font-weight:600;
  cursor:pointer;transition:all 0.2s;border:1px solid var(--border);
  font-family:'Noto Sans SC',system-ui,sans-serif;letter-spacing:0.04em;}
.qg-btn-primary{background:var(--vermilion);color:#fff;border-color:var(--vermilion);}
.qg-btn-primary:hover{opacity:0.85;}
.qg-btn-secondary{background:transparent;color:var(--muted);}
.qg-btn-secondary:hover{color:var(--ink);border-color:var(--ink);}

/* Divination area */
.qg-area{display:none;}
.qg-area.active{display:block;}

/* Coins */
.qg-coins{display:flex;justify-content:center;gap:24px;margin:32px 0 24px;}
.qg-coin{width:72px;height:72px;border-radius:50%;
  border:2px solid var(--ghost);background:var(--card-bg);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:700;color:var(--ink);
  font-family:'Noto Serif SC','STSong',serif;
  transition:all 0.3s;position:relative;}
.qg-coin.shaking{animation:coinShake 0.12s infinite alternate;}
.qg-coin.yang{border-color:var(--vermilion);color:var(--vermilion);}
.qg-coin.yin{border-color:var(--ghost);color:var(--ghost);}
@keyframes coinShake{
  0%{transform:translateY(-3px) rotate(-5deg);}
  100%{transform:translateY(3px) rotate(5deg);}
}

/* Progress */
.qg-progress{margin:24px 0;text-align:center;}
.qg-step-label{font-size:12px;color:var(--muted);margin-bottom:12px;letter-spacing:0.06em;}

/* Hexagram build area */
.qg-hex-build{display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:20px;background:var(--card-bg);border:0.5px solid var(--border);
  border-radius:8px;min-height:140px;justify-content:flex-end;}
.qg-line{display:flex;align-items:center;gap:8px;opacity:0;
  transform:translateY(8px);transition:all 0.4s ease;}
.qg-line.visible{opacity:1;transform:translateY(0);}
.qg-line-label{font-size:10px;color:var(--ghost);width:28px;text-align:right;
  font-family:'Noto Sans SC',system-ui,sans-serif;}
.qg-line-bar{height:5px;border-radius:1px;}
.qg-line-yang .qg-line-bar{width:80px;background:var(--ink);}
.qg-line-yin-bars{display:flex;align-items:center;width:80px;}
.qg-line-yin-bars .qg-line-bar-l,.qg-line-yin-bars .qg-line-bar-r{flex:1;height:5px;
  background:var(--ink);border-radius:1px;}
.qg-line-yin-bars .qg-line-gap{width:14px;flex-shrink:0;}
.qg-line-change{font-size:9px;color:var(--vermilion);width:16px;font-weight:700;}
.qg-legend{font-size:11px;color:var(--ghost);text-align:center;margin-top:6px;
  letter-spacing:0.03em;font-family:'Noto Sans SC',system-ui,sans-serif;}
.qg-legend span{color:var(--vermilion);font-weight:700;}

/* Throw button */
.qg-throw{display:block;margin:20px auto 0;padding:12px 40px;border-radius:8px;
  font-size:15px;font-weight:600;cursor:pointer;transition:all 0.2s;
  background:var(--vermilion);color:#fff;border:none;
  font-family:'Noto Sans SC',system-ui,sans-serif;letter-spacing:0.06em;}
.qg-throw:hover{opacity:0.85;}
.qg-throw:disabled{opacity:0.4;cursor:not-allowed;}

/* Result */
.qg-result{display:none;text-align:center;margin-top:32px;
  padding:28px 20px;background:var(--card-bg);
  border:0.5px solid var(--border);border-radius:8px;}
.qg-result.active{display:block;}
.qg-result-title{font-size:13px;color:var(--muted);margin-bottom:16px;letter-spacing:0.06em;}
.qg-hex-pair{display:flex;justify-content:center;align-items:center;gap:32px;
  margin-bottom:20px;flex-wrap:wrap;}
.qg-hex-card{text-align:center;}
.qg-hex-card .hex-name{font-size:18px;font-weight:700;margin-top:8px;letter-spacing:0.06em;}
.qg-hex-card .hex-id{font-size:11px;color:var(--muted);margin-top:2px;}
.qg-hex-card .hex-label{font-size:10px;color:var(--ghost);margin-bottom:6px;letter-spacing:0.08em;}
.qg-arrow{font-size:20px;color:var(--ghost);}
.qg-tip{font-size:12px;color:var(--ink-light);line-height:1.8;
  margin:16px 0;padding:12px 16px;background:var(--bg-alt);
  border-radius:6px;text-align:left;}
.qg-tip strong{color:var(--ink);}
.qg-result-actions{display:flex;gap:12px;justify-content:center;margin-top:20px;flex-wrap:wrap;}

/* Source note */
.qg-source{text-align:center;font-size:10px;color:var(--ghost);margin-top:40px;
  font-family:'Noto Sans SC',system-ui,sans-serif;}

/* ===== AI Interpretation ===== */
.qg-ai{display:none;margin-top:24px;
  border:0.5px solid var(--border);border-radius:8px;
  background:var(--card-bg);overflow:hidden;}
.qg-ai.active{display:block;}

.qg-ai-header{padding:16px 20px 0;text-align:center;}
.qg-ai-title{font-size:13px;color:var(--muted);letter-spacing:0.06em;margin-bottom:12px;}

.qg-ai-input-area{padding:0 20px 16px;}
.qg-ai-textarea{width:100%;min-height:60px;max-height:120px;padding:10px 12px;
  border:0.5px solid var(--border);border-radius:6px;resize:vertical;
  font-size:13px;line-height:1.6;color:var(--ink);background:var(--bg);
  font-family:'Noto Sans SC',system-ui,sans-serif;
  transition:border-color 0.2s;}
.qg-ai-textarea:focus{outline:none;border-color:var(--vermilion);}
.qg-ai-textarea::placeholder{color:var(--ghost);}

.qg-ai-actions{display:flex;gap:10px;justify-content:center;margin-top:12px;}
.qg-ai-btn{padding:8px 24px;border-radius:6px;font-size:13px;font-weight:600;
  cursor:pointer;transition:all 0.2s;border:1px solid var(--vermilion);
  background:var(--vermilion);color:#fff;
  font-family:'Noto Sans SC',system-ui,sans-serif;letter-spacing:0.04em;}
.qg-ai-btn:hover{opacity:0.85;}
.qg-ai-btn:disabled{opacity:0.4;cursor:not-allowed;}
.qg-ai-btn-stop{background:transparent;color:var(--muted);border-color:var(--border);
  display:none;}
.qg-ai-btn-stop:hover{color:var(--ink);border-color:var(--ink);}

.qg-ai-output{display:none;padding:0 20px 20px;}
.qg-ai-output.active{display:block;}
.qg-ai-content{font-size:13px;color:var(--ink-light);line-height:2;
  text-align:left;white-space:pre-wrap;word-break:break-word;}
.qg-ai-content strong{color:var(--ink);}
.qg-ai-content code{font-size:12px;background:var(--bg-alt);padding:1px 4px;
  border-radius:3px;}

.qg-ai-loading{padding:24px 20px;text-align:center;}
.qg-ai-loading-text{font-size:12px;color:var(--muted);letter-spacing:0.06em;
  font-family:'Noto Sans SC',system-ui,sans-serif;margin-bottom:12px;}
.qg-ai-loading-dots{display:flex;justify-content:center;gap:6px;}
.qg-ai-loading-dots span{width:6px;height:6px;border-radius:50%;
  background:var(--vermilion);opacity:0.3;
  animation:aiDotPulse 1.4s ease-in-out infinite;}
.qg-ai-loading-dots span:nth-child(2){animation-delay:0.2s;}
.qg-ai-loading-dots span:nth-child(3){animation-delay:0.4s;}
@keyframes aiDotPulse{0%,80%,100%{opacity:0.2;transform:scale(0.8);}
  40%{opacity:1;transform:scale(1.2);}}

.qg-ai-disclaimer{margin-top:16px;padding-top:12px;
  border-top:0.5px solid var(--border);
  font-size:10px;color:var(--ghost);line-height:1.8;
  font-family:'Noto Sans SC',system-ui,sans-serif;}

/* Mobile */
@media(max-width:480px){
  .qg-page{padding:72px 16px 32px;}
  .qg-coin{width:60px;height:60px;font-size:16px;}
  .qg-coins{gap:16px;}
  .qg-hex-pair{gap:20px;}
  .qg-ai-textarea{min-height:48px;}
}
</style>

<script>
(function() {
  'use strict';

  /* ===== State ===== */
  let hexData = [];          // All 64 hexagrams
  let lineResults = [];      // Array of {value: 6|7|8|9, coins: [3|2, 3|2, 3|2]}
  let mode = '';             // 'coin' | 'quick'
  let throwing = false;

  const LINE_NAMES = ['初', '二', '三', '四', '五', '上'];
  const YAO_NAMES_YANG = ['初九', '九二', '九三', '九四', '九五', '上九'];
  const YAO_NAMES_YIN  = ['初六', '六二', '六三', '六四', '六五', '上六'];

  /* ===== Load hexagram data ===== */
  fetch('/data/hexagrams.json?v=3')
    .then(r => r.json())
    .then(data => { hexData = data; })
    .catch(() => { console.error('Failed to load hexagrams.json'); });

  /* ===== Mini hexagram SVG ===== */
  function miniHexSVG(lines, size) {
    if (!lines || lines.length < 6) return '';
    const s = size || 28;
    const lw = s * 0.8;
    const lh = s * 0.07;
    const gap = s * 0.1;
    const bg = s * 0.16;
    const th = 6 * lh + 5 * gap;
    const x0 = (s - lw) / 2;
    let svg = '';
    for (let i = 0; i < 6; i++) {
      const li = 5 - i;
      const y = i * (lh + gap);
      if (lines[li] === 1) {
        svg += `<rect x="${x0}" y="${y}" width="${lw}" height="${lh}" rx="0.5" fill="currentColor"/>`;
      } else {
        const sw = (lw - bg) / 2;
        svg += `<rect x="${x0}" y="${y}" width="${sw}" height="${lh}" rx="0.5" fill="currentColor"/>`;
        svg += `<rect x="${x0 + sw + bg}" y="${y}" width="${sw}" height="${lh}" rx="0.5" fill="currentColor"/>`;
      }
    }
    return `<svg viewBox="0 0 ${s} ${th}" width="${s}" height="${th}" style="display:inline-block" xmlns="http://www.w3.org/2000/svg">${svg}</svg>`;
  }

  /* ===== Find hexagram by lines ===== */
  function findHexagram(lines) {
    return hexData.find(h => h.lines.every((l, i) => l === lines[i]));
  }

  /* ===== Start modes ===== */
  window.startCoin = function() {
    mode = 'coin';
    lineResults = [];
    document.getElementById('qg-intro').style.display = 'none';
    document.getElementById('qg-coin-area').classList.add('active');
    document.getElementById('qg-result').classList.remove('active');
    document.getElementById('qg-hex-build').innerHTML = '';
    document.getElementById('qg-legend').style.display = 'none';
    document.getElementById('qg-throw-btn').disabled = false;
    updateStepLabel();
    resetCoins();
  };

  window.startQuick = function() {
    mode = 'quick';
    lineResults = [];
    document.getElementById('qg-intro').style.display = 'none';
    document.getElementById('qg-coin-area').classList.add('active');
    document.getElementById('qg-result').classList.remove('active');
    document.getElementById('qg-hex-build').innerHTML = '';
    document.getElementById('qg-legend').style.display = 'none';
    document.getElementById('qg-throw-btn').style.display = 'none';
    document.getElementById('qg-step-label').textContent = '速成起卦中…';

    // Generate all 6 lines with coin probabilities
    for (let i = 0; i < 6; i++) {
      const coins = [Math.random() < 0.5 ? 3 : 2,
                     Math.random() < 0.5 ? 3 : 2,
                     Math.random() < 0.5 ? 3 : 2];
      lineResults.push({ value: coins[0] + coins[1] + coins[2], coins });
    }

    // Animate lines appearing one by one
    let idx = 0;
    function showNext() {
      if (idx >= 6) {
        setTimeout(showResult, 400);
        return;
      }
      addLineToDisplay(idx, lineResults[idx]);
      idx++;
      setTimeout(showNext, 300);
    }
    showNext();
  };

  /* ===== Throw coins ===== */
  window.throwCoins = function() {
    if (throwing || lineResults.length >= 6) return;
    throwing = true;
    const btn = document.getElementById('qg-throw-btn');
    btn.disabled = true;

    // Shake animation
    const coinEls = [
      document.getElementById('coin-0'),
      document.getElementById('coin-1'),
      document.getElementById('coin-2')
    ];
    coinEls.forEach(c => {
      c.textContent = '？';
      c.className = 'qg-coin shaking';
    });

    // Resolve after animation
    setTimeout(() => {
      const coins = [
        Math.random() < 0.5 ? 3 : 2,
        Math.random() < 0.5 ? 3 : 2,
        Math.random() < 0.5 ? 3 : 2
      ];
      const sum = coins[0] + coins[1] + coins[2];

      // Show coin results
      coinEls.forEach((c, i) => {
        c.classList.remove('shaking');
        if (coins[i] === 3) {
          c.textContent = '正';
          c.className = 'qg-coin yang';
        } else {
          c.textContent = '反';
          c.className = 'qg-coin yin';
        }
      });

      lineResults.push({ value: sum, coins });
      const idx = lineResults.length - 1;

      // Add line to display
      setTimeout(() => {
        addLineToDisplay(idx, lineResults[idx]);
        throwing = false;

        if (lineResults.length >= 6) {
          btn.disabled = true;
          btn.textContent = '卦象已成';
          setTimeout(showResult, 600);
        } else {
          btn.disabled = false;
          updateStepLabel();
        }
      }, 300);
    }, 1200);
  };

  /* ===== UI helpers ===== */
  function resetCoins() {
    for (let i = 0; i < 3; i++) {
      const c = document.getElementById('coin-' + i);
      c.textContent = '？';
      c.className = 'qg-coin';
    }
  }

  function updateStepLabel() {
    const n = lineResults.length;
    const ordinals = ['一', '二', '三', '四', '五', '六'];
    const names = ['初爻', '二爻', '三爻', '四爻', '五爻', '上爻'];
    if (n < 6) {
      document.getElementById('qg-step-label').textContent =
        `第${ordinals[n]}爻（${names[n]}）`;
    }
  }

  function addLineToDisplay(idx, result) {
    const build = document.getElementById('qg-hex-build');
    const v = result.value;
    const isYang = (v === 7 || v === 9);
    const isChanging = (v === 6 || v === 9);

    const line = document.createElement('div');
    line.className = `qg-line ${isYang ? 'qg-line-yang' : 'qg-line-yin'}`;

    const label = document.createElement('span');
    label.className = 'qg-line-label';
    label.textContent = LINE_NAMES[idx];

    const changeMarker = document.createElement('span');
    changeMarker.className = 'qg-line-change';
    changeMarker.textContent = isChanging ? (v === 9 ? '○' : '×') : '';
    if (isChanging) document.getElementById('qg-legend').style.display = '';

    if (isYang) {
      const bar = document.createElement('span');
      bar.className = 'qg-line-bar';
      line.appendChild(label);
      line.appendChild(bar);
      line.appendChild(changeMarker);
    } else {
      const barsWrap = document.createElement('span');
      barsWrap.className = 'qg-line-yin-bars';
      const barL = document.createElement('span');
      barL.className = 'qg-line-bar-l';
      const gap = document.createElement('span');
      gap.className = 'qg-line-gap';
      const barR = document.createElement('span');
      barR.className = 'qg-line-bar-r';
      barsWrap.appendChild(barL);
      barsWrap.appendChild(gap);
      barsWrap.appendChild(barR);
      line.appendChild(label);
      line.appendChild(barsWrap);
      line.appendChild(changeMarker);
    }

    // Insert at top (lines display top-down but build bottom-up)
    build.insertBefore(line, build.firstChild);
    requestAnimationFrame(() => {
      requestAnimationFrame(() => line.classList.add('visible'));
    });
  }

  /* ===== Show result ===== */
  function showResult() {
    if (hexData.length === 0) {
      setTimeout(showResult, 500);
      return;
    }

    // Build lines array [bottom to top] = [line0 ... line5]
    const originalLines = lineResults.map(r => (r.value === 7 || r.value === 9) ? 1 : 0);
    const originalHex = findHexagram(originalLines);

    // Check for changing lines
    const changingIndices = [];
    lineResults.forEach((r, i) => {
      if (r.value === 6 || r.value === 9) changingIndices.push(i);
    });

    let transformedHex = null;
    if (changingIndices.length > 0) {
      const transformedLines = lineResults.map(r => {
        if (r.value === 9) return 0;  // old yang → yin
        if (r.value === 6) return 1;  // old yin → yang
        return (r.value === 7) ? 1 : 0;
      });
      transformedHex = findHexagram(transformedLines);
    }

    // Build result HTML
    const pair = document.getElementById('qg-hex-pair');
    let html = '';

    if (originalHex) {
      html += `<div class="qg-hex-card">
        <div class="hex-label">本 卦</div>
        ${miniHexSVG(originalHex.lines, 56)}
        <div class="hex-name">${esc(originalHex.name)}</div>
        <div class="hex-id">第${originalHex.id}卦</div>
      </div>`;
    }

    if (transformedHex) {
      html += `<div class="qg-arrow">→</div>`;
      html += `<div class="qg-hex-card">
        <div class="hex-label">变 卦</div>
        ${miniHexSVG(transformedHex.lines, 56)}
        <div class="hex-name">${esc(transformedHex.name)}</div>
        <div class="hex-id">第${transformedHex.id}卦</div>
      </div>`;
    }

    pair.innerHTML = html;

    // Interpretation tip (七条规则)
    const tip = document.getElementById('qg-tip');
    const n = changingIndices.length;
    let tipText = '';

    if (n === 0) {
      tipText = '<strong>无变爻</strong> → 看本卦卦辞';
    } else if (n === 1) {
      const pos = changingIndices[0];
      const yaoName = originalLines[pos] === 1 ? YAO_NAMES_YANG[pos] : YAO_NAMES_YIN[pos];
      tipText = `<strong>一个变爻（${yaoName}）</strong> → 看本卦该爻的爻辞`;
    } else if (n === 2) {
      tipText = '<strong>两个变爻</strong> → 看本卦两个变爻的爻辞，以上面的为主';
    } else if (n === 3) {
      tipText = '<strong>三个变爻</strong> → 看本卦和变卦的卦辞，以本卦为主';
    } else if (n === 4) {
      tipText = '<strong>四个变爻</strong> → 看变卦中两个不变爻的爻辞，以下面的为主';
    } else if (n === 5) {
      tipText = '<strong>五个变爻</strong> → 看变卦中唯一不变爻的爻辞';
    } else if (n === 6) {
      if (originalHex && (originalHex.id === 1 || originalHex.id === 2)) {
        tipText = '<strong>六爻全变</strong> → ' +
          (originalHex.id === 1 ? '乾卦看「用九」' : '坤卦看「用六」');
      } else {
        tipText = '<strong>六爻全变</strong> → 看变卦卦辞';
      }
    }
    tipText += '<br><span style="font-size:11px;color:var(--ghost);">——朱熹《易学启蒙》七条断卦规则</span>';
    tip.innerHTML = tipText;

    // Link
    const link = document.getElementById('qg-view-link');
    if (originalHex) {
      link.href = '/hexagram.html?id=' + originalHex.id;
    }

    document.getElementById('qg-result').classList.add('active');

    // Show AI interpretation section and store result for prompt building
    lastOriginalHex = originalHex;
    lastTransformedHex = transformedHex;
    lastChangingIndices = changingIndices;
    lastOriginalLines = originalLines;
    const aiEl = document.getElementById('qg-ai');
    if (aiEl) {
      aiEl.classList.add('active');
      document.getElementById('qg-ai-input-area').style.display = '';
      document.getElementById('qg-ai-output').classList.remove('active');
      document.getElementById('qg-ai-content').textContent = '';
      const ta = document.getElementById('qg-ai-question');
      if (ta) ta.value = '';
    }
  }

  /* ===== AI Interpretation ===== */
  let lastOriginalHex = null;
  let lastTransformedHex = null;
  let lastChangingIndices = [];
  let lastOriginalLines = [];
  let aiAbort = null;
  let aiStreaming = false;

  function buildInterpretRule(n, changingIndices, originalLines, originalHex) {
    if (n === 0) return '无变爻，看本卦卦辞。';
    if (n === 1) {
      const pos = changingIndices[0];
      const yaoName = originalLines[pos] === 1 ? YAO_NAMES_YANG[pos] : YAO_NAMES_YIN[pos];
      return `一个变爻（${yaoName}），看本卦该爻的爻辞。`;
    }
    if (n === 2) return '两个变爻，看本卦两个变爻的爻辞，以上面的为主。';
    if (n === 3) return '三个变爻，看本卦和变卦的卦辞，以本卦为主。';
    if (n === 4) return '四个变爻，看变卦中两个不变爻的爻辞，以下面的为主。';
    if (n === 5) return '五个变爻，看变卦中唯一不变爻的爻辞。';
    if (originalHex && (originalHex.id === 1 || originalHex.id === 2))
      return '六爻全变，' + (originalHex.id === 1 ? '乾卦看「用九」。' : '坤卦看「用六」。');
    return '六爻全变，看变卦卦辞。';
  }

  function buildDivinationPrompt(userQuestion) {
    const h = lastOriginalHex;
    const t = lastTransformedHex;
    const ci = lastChangingIndices;
    const ol = lastOriginalLines;
    if (!h) return '';

    let prompt = '你是精通《周易》的解读者，语气温和中肯，用现代中文回答。\n\n';
    prompt += `【本卦】第${h.id}卦「${h.name}」（${h.pinyin}）\n`;
    prompt += `上卦：${h.upperTrigram}，下卦：${h.lowerTrigram}\n`;
    prompt += `卦辞：${h.guaci}\n`;
    if (h.tuan) prompt += `彖传：${h.tuan}\n`;
    if (h.xiang) prompt += `大象传：${h.xiang}\n`;
    if (h.yaoci && h.yaoci.length > 0) {
      prompt += '爻辞：\n';
      h.yaoci.forEach(y => {
        prompt += `  ${y.name}：${y.text}\n`;
        if (y.xiang) prompt += `    小象传：${y.xiang}\n`;
      });
    }

    if (t) {
      prompt += `\n【变卦】第${t.id}卦「${t.name}」（${t.pinyin}）\n`;
      prompt += `卦辞：${t.guaci}\n`;
      if (t.xiang) prompt += `大象传：${t.xiang}\n`;
    }

    const n = ci.length;
    if (ci.length > 0) {
      const names = ci.map(i => ol[i] === 1 ? YAO_NAMES_YANG[i] : YAO_NAMES_YIN[i]);
      prompt += `\n动爻：${names.join('、')}\n`;
    }
    prompt += `\n【断卦规则（朱熹《易学启蒙》）】\n${buildInterpretRule(n, ci, ol, h)}\n`;

    prompt += '\n【解读要求】\n';
    prompt += '1. 先引用应参考的原文\n';
    prompt += '2. 用现代白话解释卦象含义\n';
    if (userQuestion) {
      prompt += '3. 结合用户描述的情境，给出建设性参考建议\n';
      prompt += '4. 语气温和中肯，300字以内\n';
    } else {
      prompt += '3. 给出这一卦的核心启示\n';
      prompt += '4. 语气温和中肯，200字以内\n';
    }

    return prompt;
  }

  window.aiInterpret = async function() {
    if (aiStreaming || !lastOriginalHex) return;
    const question = (document.getElementById('qg-ai-question') || {}).value || '';
    const systemPrompt = buildDivinationPrompt(question.trim());
    const userMsg = question.trim()
      ? `我的问题是：${question.trim()}\n请结合卦象为我解读。`
      : '请为我解读这一卦。';

    // UI: hide input, show loading state
    document.getElementById('qg-ai-input-area').style.display = 'none';
    const outputEl = document.getElementById('qg-ai-output');
    const contentEl = document.getElementById('qg-ai-content');
    outputEl.classList.add('active');
    contentEl.innerHTML = '';
    // Show loading indicator
    let loadingEl = document.getElementById('qg-ai-loading');
    if (!loadingEl) {
      loadingEl = document.createElement('div');
      loadingEl.className = 'qg-ai-loading';
      loadingEl.id = 'qg-ai-loading';
      loadingEl.innerHTML = '<div class="qg-ai-loading-text">正在解读中，请稍候…</div>' +
        '<div class="qg-ai-loading-dots"><span></span><span></span><span></span></div>';
      outputEl.insertBefore(loadingEl, outputEl.firstChild);
    }
    loadingEl.style.display = '';
    setAIStreaming(true);

    try {
      aiAbort = new AbortController();
      const KEYS = {
        provider: 'yaoguayi_ai_provider',
        key: 'yaoguayi_ai_key',
        base: 'yaoguayi_ai_base',
        model: 'yaoguayi_ai_model'
      };
      const DEFAULT_MODELS = { agnes: 'agnes-2.0-flash', openai: 'gpt-4o-mini', anthropic: 'claude-3-haiku-20240307' };
      const DEFAULT_BASES = { agnes: 'https://apihub.agnes-ai.com/v1', openai: 'https://api.openai.com/v1' };

      const provider = localStorage.getItem(KEYS.provider) || 'agnes';
      const key = localStorage.getItem(KEYS.key) || '';
      const base = localStorage.getItem(KEYS.base) || DEFAULT_BASES[provider] || '';
      const model = localStorage.getItem(KEYS.model) || DEFAULT_MODELS[provider] || '';
      const isAdmin = typeof YaoguayiAuth !== 'undefined' && YaoguayiAuth.isAdmin();
      const hasLocalKey = key && isAdmin;

      let outputText = '';
      function onChunk(text) {
        if (!outputText) {
          const ld = document.getElementById('qg-ai-loading');
          if (ld) ld.style.display = 'none';
        }
        outputText += text;
        contentEl.innerHTML = escHtml(outputText)
          .replace(/\n/g, '<br>')
          .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
          .replace(/`([^`]+)`/g, '<code>$1</code>');
        contentEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }

      const messages = [
        { role: 'system', content: systemPrompt },
        { role: 'user', content: userMsg }
      ];

      if (hasLocalKey && provider === 'anthropic') {
        await aiStreamAnthropic(base, key, model || DEFAULT_MODELS.anthropic, systemPrompt, userMsg, onChunk);
      } else if (hasLocalKey) {
        await aiStreamOpenAI((base || DEFAULT_BASES[provider] || DEFAULT_BASES.openai).replace(/\/+$/, ''),
          key, model, messages, onChunk);
      } else {
        await aiStreamProxy(messages, onChunk);
      }

      if (!outputText) contentEl.textContent = '未收到回复，请稍后重试。';
    } catch (err) {
      const ld = document.getElementById('qg-ai-loading');
      if (ld) ld.style.display = 'none';
      if (err.name === 'AbortError') {
        contentEl.innerHTML += '<br><span style="color:var(--ghost);">[已停止]</span>';
      } else {
        contentEl.textContent = '解读失败：' + err.message;
      }
    } finally {
      setAIStreaming(false);
      aiAbort = null;
    }
  };

  window.aiStop = function() {
    if (aiAbort) aiAbort.abort();
  };

  function setAIStreaming(val) {
    aiStreaming = val;
    const submit = document.getElementById('qg-ai-submit');
    const stop = document.getElementById('qg-ai-stop');
    if (submit) submit.style.display = val ? 'none' : '';
    if (stop) stop.style.display = val ? '' : 'none';
  }

  async function aiStreamProxy(messages, onChunk) {
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages, stream: true }),
      signal: aiAbort.signal
    });
    if (!resp.ok) throw new Error(`API ${resp.status}: ${await resp.text().catch(() => resp.statusText)}`);
    await readSSE(resp, onChunk);
  }

  async function aiStreamOpenAI(baseUrl, key, model, messages, onChunk) {
    const resp = await fetch(`${baseUrl}/chat/completions`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
      body: JSON.stringify({ model, messages, stream: true }),
      signal: aiAbort.signal
    });
    if (!resp.ok) throw new Error(`API ${resp.status}: ${await resp.text().catch(() => resp.statusText)}`);
    await readSSE(resp, onChunk);
  }

  async function aiStreamAnthropic(base, key, model, systemPrompt, userMsg, onChunk) {
    const baseUrl = (base || 'https://api.anthropic.com').replace(/\/+$/, '');
    const resp = await fetch(`${baseUrl}/v1/messages`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': key,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model, max_tokens: 2048, system: systemPrompt,
        messages: [{ role: 'user', content: userMsg }],
        stream: true
      }),
      signal: aiAbort.signal
    });
    if (!resp.ok) throw new Error(`API ${resp.status}: ${await resp.text().catch(() => resp.statusText)}`);
    await readAnthropicSSE(resp, onChunk);
  }

  async function readSSE(resp, onChunk) {
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';
      for (const line of lines) {
        const t = line.trim();
        if (!t || !t.startsWith('data: ')) continue;
        const data = t.slice(6);
        if (data === '[DONE]') return;
        try {
          const j = JSON.parse(data);
          const delta = j.choices?.[0]?.delta?.content;
          if (delta) onChunk(delta);
        } catch {}
      }
    }
  }

  async function readAnthropicSSE(resp, onChunk) {
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';
      for (const line of lines) {
        const t = line.trim();
        if (!t || !t.startsWith('data: ')) continue;
        try {
          const j = JSON.parse(t.slice(6));
          if (j.type === 'content_block_delta' && j.delta?.text) onChunk(j.delta.text);
        } catch {}
      }
    }
  }

  function escHtml(text) {
    const d = document.createElement('div');
    d.textContent = text;
    return d.innerHTML;
  }

  /* ===== Reset ===== */
  window.resetAll = function() {
    lineResults = [];
    mode = '';
    throwing = false;
    lastOriginalHex = null;
    lastTransformedHex = null;
    lastChangingIndices = [];
    lastOriginalLines = [];
    if (aiAbort) aiAbort.abort();
    aiStreaming = false;
    document.getElementById('qg-intro').style.display = '';
    document.getElementById('qg-coin-area').classList.remove('active');
    document.getElementById('qg-result').classList.remove('active');
    document.getElementById('qg-ai').classList.remove('active');
    document.getElementById('qg-hex-build').innerHTML = '';
    document.getElementById('qg-legend').style.display = 'none';
    document.getElementById('qg-throw-btn').style.display = '';
    document.getElementById('qg-throw-btn').disabled = false;
    document.getElementById('qg-throw-btn').textContent = '摇 卦';
    resetCoins();
  };

  function esc(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }
})();

if (typeof Notepad !== 'undefined') Notepad.init();
</script>
