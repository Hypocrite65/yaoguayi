# Nginx config for yaoguayi.com
# Place at /etc/nginx/sites-available/yaoguayi.com
# Then symlink to /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name yaoguayi.com www.yaoguayi.com;

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yaoguayi.com www.yaoguayi.com;

    # SSL certs managed by certbot (paths will be auto-filled)
    ssl_certificate /etc/letsencrypt/live/yaoguayi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yaoguayi.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Site root — points to site/ subdirectory in the repo
    root /var/www/yaoguayi/site;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_min_length 256;

    # Static file caching
    location ~* \.(svg|ico|css|js|png|jpg|jpeg|gif|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Block hidden files
    location ~ /\. {
        deny all;
    }
}
