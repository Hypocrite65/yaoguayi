<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>爻卦易</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;background:#f5f0e8;overflow:hidden;
  font-family:'Noto Serif SC','Source Han Serif CN','STSong','SimSun',serif;
  color:#1a1a1a;}

/* 导航 */
nav{
  position:fixed;top:0;left:0;right:0;height:50px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 36px;
  border-bottom:0.5px solid rgba(26,26,26,0.08);
  background:rgba(245,240,232,0.9);
  backdrop-filter:blur(8px);
  z-index:20;
}
.logo{font-size:15px;letter-spacing:0.22em;color:#1a1a1a;}
.nav-links{display:flex;gap:28px;}
.nav-links a{font-size:11px;letter-spacing:0.14em;color:#8a7e70;
  text-decoration:none;cursor:pointer;
  transition:color 0.2s;}
.nav-links a:hover{color:#1a1a1a;}

/* 星盘容器 */
#map-wrap{
  position:fixed;top:50px;left:0;right:0;bottom:48px;
  display:flex;align-items:center;justify-content:center;
}
#starmap{
  width:min(90vw,820px);
  height:auto;
  overflow:visible;
}

/* Tooltip */
#tooltip{
  position:fixed;
  pointer-events:none;
  opacity:0;
  transition:opacity 0.2s;
  z-index:30;
}
.tt-sym{font-size:28px;color:#1a1a1a;line-height:1;text-align:center;}
.tt-info{font-size:11px;letter-spacing:0.12em;color:#a09080;text-align:center;margin-top:4px;}
.tt-name{font-size:16px;letter-spacing:0.18em;color:#1a1a1a;text-align:center;margin-top:2px;}

/* 底部引句 */
footer{
  position:fixed;bottom:0;left:0;right:0;height:48px;
  display:flex;align-items:center;justify-content:center;
  border-top:0.5px solid rgba(26,26,26,0.08);
}
.footer-text{
  font-size:11px;letter-spacing:0.22em;color:#b8a898;
}

/* 点的进场动画 */
@keyframes dotIn{
  from{opacity:0;transform-origin:center center;transform:scale(0.2);}
  to{opacity:var(--op);transform:scale(1);}
}
.hex-dot{
  cursor:pointer;
  transition:r 0.2s, opacity 0.2s;
}
</style>
</head>
<body>

<nav>
  <div class="logo">爻卦易</div>
  <div class="nav-links">
    <a>六十四卦</a>
    <a>起卦</a>
    <a>读易</a>
    <a>关于</a>
  </div>
</nav>

<div id="map-wrap">
  <svg id="starmap" viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="diskGrad" cx="50%" cy="38%" r="62%">
        <stop offset="0%" stop-color="#fdfaf4"/>
        <stop offset="100%" stop-color="#ede5d2"/>
      </radialGradient>
      <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#c0392b" stop-opacity="0.14"/>
        <stop offset="100%" stop-color="#c0392b" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <!-- 天盘主体 -->
    <ellipse cx="350" cy="210" rx="278" ry="158"
             fill="url(#diskGrad)" stroke="#1a1a1a"
             stroke-width="1.2" opacity="0.97"/>

    <!-- 同心圆环 -->
    <ellipse cx="350" cy="210" rx="228" ry="130" stroke="#1a1a1a" stroke-width="0.4" fill="none" opacity="0.1"/>
    <ellipse cx="350" cy="210" rx="178" ry="101" stroke="#1a1a1a" stroke-width="0.4" fill="none" opacity="0.1"/>
    <ellipse cx="350" cy="210" rx="128" ry="73"  stroke="#1a1a1a" stroke-width="0.4" fill="none" opacity="0.1"/>
    <ellipse cx="350" cy="210" rx="78"  ry="44"  stroke="#1a1a1a" stroke-width="0.4" fill="none" opacity="0.1"/>

    <!-- 八宫分区线 -->
    <g stroke="#1a1a1a" stroke-width="0.5" opacity="0.13">
      <line x1="350" y1="210" x2="628" y2="210"/>
      <line x1="350" y1="210" x2="547" y2="322"/>
      <line x1="350" y1="210" x2="350" y2="368"/>
      <line x1="350" y1="210" x2="153" y2="322"/>
      <line x1="350" y1="210" x2="72"  y2="210"/>
      <line x1="350" y1="210" x2="153" y2="98"/>
      <line x1="350" y1="210" x2="350" y2="52"/>
      <line x1="350" y1="210" x2="547" y2="98"/>
    </g>

    <!-- 卦点组（JS填入） -->
    <g id="dots-group"/>

    <!-- 圆心：观者位置 -->
    <circle cx="350" cy="210" r="32" fill="url(#centerGlow)"/>
    <circle cx="350" cy="210" r="3.5" fill="#c0392b" opacity="0.85"/>

    <!-- 八卦方位标注（后天） -->
    <g font-family="'Noto Serif SC',serif" fill="#1a1a1a" opacity="0.72">
      <!-- 南·離 top -->
      <text x="350" y="36"  text-anchor="middle" font-size="13">☲</text>
      <text x="350" y="48"  text-anchor="middle" font-size="10" letter-spacing="2">離</text>
      <!-- 坤 SW top-left -->
      <text x="126" y="82"  text-anchor="end"    font-size="13">☷</text>
      <text x="120" y="94"  text-anchor="end"    font-size="10" letter-spacing="2">坤</text>
      <!-- 兌 West left -->
      <text x="46"  y="207" text-anchor="end"    font-size="13">☱</text>
      <text x="40"  y="219" text-anchor="end"    font-size="10" letter-spacing="2">兌</text>
      <!-- 乾 NW bottom-left -->
      <text x="126" y="338" text-anchor="end"    font-size="13" fill="#c0392b" opacity="0.9">☰</text>
      <text x="120" y="350" text-anchor="end"    font-size="10" letter-spacing="2" fill="#c0392b" opacity="0.9">乾</text>
      <!-- 坎 North bottom -->
      <text x="350" y="386" text-anchor="middle" font-size="13">☵</text>
      <text x="350" y="398" text-anchor="middle" font-size="10" letter-spacing="2">坎</text>
      <!-- 艮 NE bottom-right -->
      <text x="574" y="338" text-anchor="start"  font-size="13">☶</text>
      <text x="580" y="350" text-anchor="start"  font-size="10" letter-spacing="2">艮</text>
      <!-- 震 East right -->
      <text x="654" y="207" text-anchor="start"  font-size="13">☳</text>
      <text x="660" y="219" text-anchor="start"  font-size="10" letter-spacing="2">震</text>
      <!-- 巽 SE top-right -->
      <text x="574" y="82"  text-anchor="start"  font-size="13">☴</text>
      <text x="580" y="94"  text-anchor="start"  font-size="10" letter-spacing="2">巽</text>
    </g>

    <!-- 方位小字 -->
    <g font-size="9" fill="#1a1a1a" opacity="0.22" font-family="serif" letter-spacing="1">
      <text x="350" y="20"  text-anchor="middle">南</text>
      <text x="350" y="414" text-anchor="middle">北</text>
      <text x="26"  y="214" text-anchor="middle">西</text>
      <text x="674" y="214" text-anchor="middle">东</text>
    </g>
  </svg>
</div>

<!-- Tooltip -->
<div id="tooltip">
  <div class="tt-sym" id="tt-sym"></div>
  <div class="tt-info" id="tt-info"></div>
  <div class="tt-name" id="tt-name"></div>
</div>

<footer>
  <span class="footer-text">仰則觀象於天 &nbsp;·&nbsp; 六十四卦</span>
</footer>

<script>
// ── 数据 ──────────────────────────────────────────────
// 八宫对应的卦序（后天八卦方位 + 八宫系统）
// 每宫8卦，内到外排列（首卦=纯卦在最内圈）
const PALACES = {
  // 方位角(SVG,顺时针from right) : [卦序号×8]
  270: { name:'離', guas:[30,56,50,64,4,59,6,13]  }, // 南·離宫
  225: { name:'坤', guas:[2,24,19,11,34,43,5,8]   }, // 西南·坤宫
  180: { name:'兌', guas:[58,47,45,31,39,15,62,54] }, // 西·兌宫
  135: { name:'乾', guas:[1,44,33,12,20,23,35,14]  }, // 西北·乾宫
   90: { name:'坎', guas:[29,60,3,63,49,55,36,7]  }, // 北·坎宫
   45: { name:'艮', guas:[52,22,26,41,38,10,61,53] }, // 东北·艮宫
    0: { name:'震', guas:[51,16,40,32,46,48,28,17] }, // 东·震宫
  315: { name:'巽', guas:[57,9,37,42,25,21,27,18]  }, // 东南·巽宫
};

const HEX_NAMES = ['','乾','坤','屯','蒙','需','訟','師','比','小畜','履',
  '泰','否','同人','大有','謙','豫','隨','蠱','臨','觀',
  '噬嗑','賁','剝','復','無妄','大畜','頤','大過','坎','離',
  '咸','恆','遯','大壯','晉','明夷','家人','睽','蹇','解',
  '損','益','夬','姤','萃','升','困','井','革','鼎',
  '震','艮','漸','歸妹','豐','旅','巽','兌','渙','節',
  '中孚','小過','既濟','未濟'];

// 每宫8个卦对应的半径（内小外大）
const RADII = [40, 72, 104, 136, 168, 200, 228, 256];

const CX = 350, CY = 210, RX = 278, RY = 158;
const SCALE = RY / RX; // 透视压缩比

// ── 生成点 ────────────────────────────────────────────
const group = document.getElementById('dots-group');
const svg = document.getElementById('starmap');
const tt = document.getElementById('tooltip');
const ttSym = document.getElementById('tt-sym');
const ttInfo = document.getElementById('tt-info');
const ttName = document.getElementById('tt-name');

let dotIndex = 0;
const allDots = [];

Object.entries(PALACES).forEach(([angDeg, palace]) => {
  const ang = parseFloat(angDeg) * Math.PI / 180;
  palace.guas.forEach((guaId, ri) => {
    const r = RADII[ri];
    const x = CX + r * Math.cos(ang);
    const y = CY + r * Math.sin(ang) * SCALE;
    const isPure = ri === 0; // 纯卦（最内圈）
    const depth = (y - (CY - RY)) / (2 * RY); // 0=远 1=近
    const baseR = isPure ? 4.5 : 3;
    const baseOp = 0.45 + depth * 0.35;
    const delay = (ri * 120 + dotIndex * 18);

    const circle = document.createElementNS('http://www.w3.org/2000/svg','circle');
    circle.setAttribute('class','hex-dot');
    circle.setAttribute('cx', x.toFixed(1));
    circle.setAttribute('cy', y.toFixed(1));
    circle.setAttribute('r', baseR);
    circle.setAttribute('fill', isPure ? '#c0392b' : '#1a1a1a');
    circle.setAttribute('opacity', baseOp.toFixed(2));
    circle.style.setProperty('--op', baseOp.toFixed(2));
    circle.style.animation = `dotIn 0.5s ease-out ${delay}ms both`;
    circle.dataset.id = guaId;
    circle.dataset.name = HEX_NAMES[guaId];
    circle.dataset.baseR = baseR;
    circle.dataset.baseOp = baseOp;

    circle.addEventListener('mouseenter', function(e){
      this.setAttribute('r', parseFloat(this.dataset.baseR) + 3);
      this.setAttribute('opacity', 1);
      const sym = String.fromCodePoint(0x4DBF + parseInt(this.dataset.id));
      ttSym.textContent = sym;
      ttInfo.textContent = `第${this.dataset.id}卦`;
      ttName.textContent = this.dataset.name;
      tt.style.opacity = '1';
      moveTT(e);
    });
    circle.addEventListener('mousemove', moveTT);
    circle.addEventListener('mouseleave', function(){
      this.setAttribute('r', this.dataset.baseR);
      this.setAttribute('opacity', this.dataset.baseOp);
      tt.style.opacity = '0';
    });
    circle.addEventListener('click', function(){
      // 实际项目中跳转：window.location.href = `/hexagrams/${this.dataset.id}`
      alert(`→ 第${this.dataset.id}卦 · ${this.dataset.name}`);
    });

    group.appendChild(circle);
    allDots.push(circle);
    dotIndex++;
  });
});

function moveTT(e){
  const x = e.clientX, y = e.clientY;
  const offX = x > window.innerWidth/2 ? -90 : 16;
  const offY = y > window.innerHeight/2 ? -80 : 16;
  tt.style.left = (x + offX) + 'px';
  tt.style.top  = (y + offY) + 'px';
}
</script>
</body>
</html>
