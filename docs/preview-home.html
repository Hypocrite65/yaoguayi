<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>爻卦易 · 观象明理</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:'Noto Serif SC','STSong','SimSun','Georgia',serif;
  color:#1a1a1a;background:#f5f0e8;overflow-x:hidden;}

/* ===== Scroll-triggered fade-in ===== */
.fade-in{opacity:0;transform:translateY(24px);transition:opacity 0.8s cubic-bezier(0.25,0.46,0.45,0.94),transform 0.8s cubic-bezier(0.25,0.46,0.45,0.94);}
.fade-in.visible{opacity:1;transform:translateY(0);}
/* Stagger delays for cover elements */
.fade-in.d1{transition-delay:0.1s;}
.fade-in.d2{transition-delay:0.25s;}
.fade-in.d3{transition-delay:0.4s;}
.fade-in.d4{transition-delay:0.55s;}
.fade-in.d5{transition-delay:0.7s;}

/* ===== Cover: full viewport ===== */
.cover{
  width:100%;height:100vh;
  display:flex;flex-direction:column;
  justify-content:center;align-items:center;
  position:relative;
  background:#f5f0e8;
}

/* Cover parallax: content fades out + drifts up on scroll */
.cover-inner{
  display:flex;flex-direction:column;align-items:center;
  transition:opacity 0.1s,transform 0.1s;
  will-change:opacity,transform;
}

/* Logo */
.cover-logo{margin-bottom:48px;display:flex;flex-direction:column;align-items:center;gap:16px;}
.cover-logo svg{width:72px;height:72px;}
.cover-brand{font-size:12px;letter-spacing:0.4em;color:#a09080;
  font-family:'Noto Sans SC',system-ui,sans-serif;font-weight:500;}
/* Logo circle draw animation */
.logo-circle{stroke-dasharray:530;stroke-dashoffset:530;
  animation:drawCircle 1.6s cubic-bezier(0.4,0,0.2,1) 0.2s forwards;}
.logo-line{opacity:0;animation:fadeInLine 0.6s cubic-bezier(0.4,0,0.2,1) forwards;}
.logo-l1{animation-delay:0.6s;}
.logo-l2{animation-delay:0.8s;}
.logo-l3{animation-delay:1.0s;}
.logo-l4{animation-delay:1.2s;}
@keyframes drawCircle{to{stroke-dashoffset:0;}}
@keyframes fadeInLine{from{opacity:0;transform:translateY(3px);}to{opacity:1;transform:translateY(0);}}

/* Title */
.cover-title{font-size:48px;letter-spacing:0.2em;color:#2c2420;
  font-weight:400;margin-bottom:20px;text-align:center;}
.cover-sub{font-size:13px;letter-spacing:0.12em;color:#8c7e72;
  line-height:2.2;text-align:center;margin-bottom:44px;}

/* Navigation row */
.cover-nav{display:flex;gap:32px;margin-bottom:56px;}
.cover-nav a{font-size:11px;letter-spacing:0.18em;color:#7a6e64;
  text-decoration:none;
  font-family:'Noto Sans SC',system-ui,sans-serif;font-weight:500;
  padding-bottom:2px;border-bottom:0.5px solid transparent;
  transition:color 0.3s,border-color 0.3s,transform 0.2s;}
.cover-nav a:hover{color:#c0392b;border-bottom-color:#c0392b;transform:translateY(-1px);}

/* Quote at bottom */
.cover-quote{position:absolute;bottom:80px;
  font-size:11px;letter-spacing:0.16em;color:#c8b8a4;
  text-align:center;line-height:2.2;}
.cover-quote em{font-style:normal;font-size:10px;color:#d4c8b8;}

/* Random hexagram card */
.random-card{
  display:flex;align-items:center;gap:20px;
  padding:14px 24px;margin-bottom:48px;
  border:0.5px solid rgba(26,26,26,0.10);border-radius:4px;
  cursor:pointer;text-decoration:none;color:inherit;
  background:rgba(237,232,220,0.4);
  transition:background 0.35s,border-color 0.35s,box-shadow 0.35s,transform 0.25s;
}
.random-card:hover{
  background:rgba(237,232,220,0.8);border-color:rgba(192,57,43,0.2);
  box-shadow:0 2px 12px rgba(26,26,26,0.06);transform:translateY(-2px);
}
.random-sym{font-size:36px;line-height:1;color:#2c2420;opacity:0.75;
  transition:opacity 0.3s,transform 0.3s;}
.random-card:hover .random-sym{opacity:1;transform:scale(1.08);}
.random-info{display:flex;flex-direction:column;gap:3px;}
.random-label{font-size:9px;letter-spacing:0.2em;color:#c0392b;
  font-family:'Noto Sans SC',system-ui,sans-serif;font-weight:600;}
.random-name{font-size:16px;letter-spacing:0.12em;color:#2c2420;}
.random-guaci{font-size:10px;color:#8c7e72;letter-spacing:0.06em;line-height:1.6;}
.random-arrow{margin-left:auto;font-size:14px;color:#c8b8a4;
  transition:transform 0.3s,color 0.3s;}
.random-card:hover .random-arrow{transform:translateX(6px);color:#c0392b;}

/* Scroll hint */
.scroll-hint{position:absolute;bottom:32px;
  display:flex;flex-direction:column;align-items:center;gap:6px;
  color:#c8b8a4;font-size:9px;letter-spacing:0.2em;
  animation:hintPulse 2.5s ease-in-out infinite;
  transition:opacity 0.4s;}
.scroll-hint.hidden{opacity:0;pointer-events:none;}
.scroll-hint::after{content:'';width:1px;height:20px;background:#c8b8a4;
  animation:hintLine 2.5s ease-in-out infinite;}
@keyframes hintPulse{0%,100%{opacity:0.4;}50%{opacity:0.8;}}
@keyframes hintLine{0%,100%{height:16px;opacity:0.3;}50%{height:24px;opacity:0.7;}}

/* ===== Divider ===== */
.section-divider{
  width:100%;padding:20px 20%;
  display:flex;align-items:center;gap:20px;
  background:linear-gradient(to bottom,#f5f0e8,#ede8dc);
}
.section-divider::before,.section-divider::after{
  content:'';flex:1;height:0.5px;background:rgba(26,26,26,0.08);
}
.section-divider span{font-size:10px;letter-spacing:0.3em;color:#c8b8a4;
  white-space:nowrap;
  font-family:'Noto Sans SC',system-ui,sans-serif;}

/* ===== Hexagram Section ===== */
.hex-section{
  background:#ede8dc;
  padding:40px 32px 24px;
  min-height:100vh;
}
.hex-header{
  max-width:960px;margin:0 auto 20px;
  display:flex;align-items:baseline;justify-content:space-between;
}
.hex-title{font-size:11px;letter-spacing:0.22em;color:#a09080;
  font-family:'Noto Sans SC',system-ui,sans-serif;font-weight:500;}
.hex-hint{font-size:10px;letter-spacing:0.12em;color:#c8b8a4;}

/* Grid */
.hex-grid{
  max-width:960px;margin:0 auto;
  display:grid;grid-template-columns:repeat(8,1fr);gap:2px;
}
.hex-cell{
  display:flex;flex-direction:column;align-items:center;
  padding:12px 4px;cursor:pointer;border-radius:3px;
  transition:background 0.2s,transform 0.2s,box-shadow 0.2s;
  /* Staggered entrance */
  opacity:0;transform:translateY(16px);
}
.hex-cell.show{opacity:1;transform:translateY(0);
  transition:opacity 0.5s cubic-bezier(0.25,0.46,0.45,0.94),
    transform 0.5s cubic-bezier(0.25,0.46,0.45,0.94),
    background 0.2s,box-shadow 0.2s;}
.hex-cell:hover{background:rgba(26,26,26,0.05);transform:scale(1.06);
  box-shadow:0 2px 8px rgba(26,26,26,0.06);}
.hex-cell.today{background:rgba(192,57,43,0.06);}
.hex-sym{font-size:22px;line-height:1;color:#1a1a1a;opacity:0.65;margin-bottom:5px;
  transition:opacity 0.2s,transform 0.3s;}
.hex-cell:hover .hex-sym{opacity:0.9;transform:scale(1.1);}
.hex-cell.today .hex-sym{color:#c0392b;opacity:0.9;}
.hex-name{font-size:11px;letter-spacing:0.08em;color:#3d3630;
  transition:color 0.2s;}
.hex-cell:hover .hex-name{color:#2c2420;}
.hex-cell.today .hex-name{color:#c0392b;}
.hex-num{font-size:8px;color:#c0b8a8;margin-top:3px;}

/* Footer */
.site-footer{
  background:#ede8dc;padding:20px 32px;
  border-top:0.5px solid rgba(26,26,26,0.06);
  text-align:center;
  font-size:9px;letter-spacing:0.14em;color:#c8b8a4;
  font-family:'Noto Sans SC',system-ui,sans-serif;
}
.site-footer a{color:#c0392b;text-decoration:none;transition:color 0.2s;}
.site-footer a:hover{color:#8c7e72;text-decoration:underline;}

/* ===== Scrollbar ===== */
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(26,26,26,0.1);border-radius:3px;}
::-webkit-scrollbar-thumb:hover{background:rgba(26,26,26,0.2);}

/* ===== Auth Gate ===== */
.auth-gate{
  position:fixed;top:0;left:0;width:100%;height:100%;
  z-index:9999;background:#f5f0e8;
  display:flex;flex-direction:column;
  justify-content:center;align-items:center;
  transition:opacity 0.6s cubic-bezier(0.25,0.46,0.45,0.94),
    transform 0.6s cubic-bezier(0.25,0.46,0.45,0.94);
}
.auth-gate.hidden{opacity:0;pointer-events:none;transform:scale(1.02);}
.auth-gate.removed{display:none;}
.auth-logo{margin-bottom:32px;}
.auth-logo svg{width:56px;height:56px;}
.auth-label{font-size:9px;letter-spacing:0.3em;color:#c0392b;
  margin-bottom:28px;
  font-family:'Noto Sans SC',system-ui,sans-serif;font-weight:600;}
.auth-form{display:flex;flex-direction:column;align-items:center;gap:14px;}
.auth-input{
  width:240px;padding:10px 16px;
  border:0.5px solid rgba(26,26,26,0.15);border-radius:3px;
  background:rgba(237,232,220,0.5);
  font-family:'Noto Serif SC',serif;font-size:13px;letter-spacing:0.08em;
  color:#2c2420;outline:none;text-align:center;
  transition:border-color 0.3s,box-shadow 0.3s;
}
.auth-input:focus{border-color:rgba(192,57,43,0.3);
  box-shadow:0 0 0 3px rgba(192,57,43,0.06);}
.auth-input::placeholder{color:#c8b8a4;letter-spacing:0.12em;}
.auth-btn{
  width:240px;padding:10px 0;
  border:none;border-radius:3px;cursor:pointer;
  background:#2c2420;color:#f5f0e8;
  font-family:'Noto Sans SC',system-ui,sans-serif;
  font-size:11px;letter-spacing:0.18em;font-weight:500;
  transition:background 0.3s,transform 0.2s;
}
.auth-btn:hover{background:#3d3630;transform:translateY(-1px);}
.auth-btn:active{transform:translateY(0);}
.auth-error{font-size:10px;color:#c0392b;letter-spacing:0.1em;
  opacity:0;transition:opacity 0.3s;height:16px;
  font-family:'Noto Sans SC',system-ui,sans-serif;}
.auth-error.show{opacity:1;}
.auth-footer{position:absolute;bottom:40px;
  font-size:9px;letter-spacing:0.16em;color:#d4c8b8;}

/* ===== Responsive ===== */
@media(max-width:768px){
  .cover-title{font-size:32px;}
  .cover-nav{gap:20px;flex-wrap:wrap;justify-content:center;}
  .cover-quote{position:static;margin-top:40px;}
  .scroll-hint{position:static;margin-top:24px;}
  .hex-grid{grid-template-columns:repeat(4,1fr);}
  .hex-section{padding:28px 16px 16px;}
}
</style>
</head>
<body>

<!-- ===== Auth Gate ===== -->
<div class="auth-gate" id="auth-gate">
  <div class="auth-logo">
    <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="100" cy="100" r="84" stroke="#5c3a30" stroke-width="5" fill="none"/>
      <line x1="100" y1="48" x2="100" y2="152" stroke="#2c2420" stroke-width="18" stroke-linecap="round"/>
      <line x1="48" y1="48" x2="100" y2="100" stroke="#2c2420" stroke-width="18" stroke-linecap="round"/>
      <line x1="152" y1="48" x2="152" y2="82" stroke="#c0392b" stroke-width="18" stroke-linecap="round"/>
      <line x1="152" y1="118" x2="152" y2="152" stroke="#c0392b" stroke-width="18" stroke-linecap="round"/>
    </svg>
  </div>
  <div class="auth-label">开发预览</div>
  <div class="auth-form">
    <input class="auth-input" id="auth-input" type="password" placeholder="请输入访问密码" autocomplete="off"/>
    <button class="auth-btn" id="auth-btn">进入</button>
    <div class="auth-error" id="auth-error">密码不正确</div>
  </div>
  <div class="auth-footer">爻卦易 · 内部预览</div>
</div>

<!-- ===== First Screen: Cover ===== -->
<section class="cover">
  <div class="cover-inner">
    <!-- Logo with draw animation -->
    <div class="cover-logo fade-in d1">
      <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle class="logo-circle" cx="100" cy="100" r="84" stroke="#5c3a30" stroke-width="5" fill="none"/>
        <line class="logo-line logo-l1" x1="100" y1="48" x2="100" y2="152" stroke="#2c2420" stroke-width="18" stroke-linecap="round"/>
        <line class="logo-line logo-l2" x1="48" y1="48" x2="100" y2="100" stroke="#2c2420" stroke-width="18" stroke-linecap="round"/>
        <line class="logo-line logo-l3" x1="152" y1="48" x2="152" y2="82" stroke="#c0392b" stroke-width="18" stroke-linecap="round"/>
        <line class="logo-line logo-l4" x1="152" y1="118" x2="152" y2="152" stroke="#c0392b" stroke-width="18" stroke-linecap="round"/>
      </svg>
      <span class="cover-brand">爻 卦 易</span>
    </div>

    <h1 class="cover-title fade-in d2">观 象 明 理</h1>
    <p class="cover-sub fade-in d3">
      在 AI 加速的时代，用三千年的智慧定一定位。<br>
      不是占卜，是观象。
    </p>

    <nav class="cover-nav fade-in d4">
      <a href="#hexagrams">六十四卦</a>
      <a href="#divination">起卦</a>
      <a href="#learn">读易</a>
    </nav>

    <a class="random-card fade-in d5" id="random-card" href="#hexagrams"></a>
  </div>

  <div class="cover-quote fade-in d5">
    仰则观象于天，俯则观法于地<br>
    <em>——《周易 · 系辞传》</em>
  </div>

  <div class="scroll-hint" id="scroll-hint">向下</div>
</section>

<!-- ===== Divider ===== -->
<div class="section-divider fade-in"><span>六十四卦</span></div>

<!-- ===== Second Screen: Hexagram Grid ===== -->
<section class="hex-section" id="hexagrams">
  <div class="hex-header fade-in">
    <span class="hex-title">六十四卦</span>
    <span class="hex-hint">点击查看卦辞</span>
  </div>
  <div class="hex-grid" id="hex-grid"></div>
</section>

<!-- ===== Footer ===== -->
<footer class="site-footer fade-in">
  爻卦易 · yaoguayi.com ·
  <a href="#about">关于本站</a> ·
  开源 · 非盈利 ·
  <a href="https://github.com/Hypocrite65/yaoguayi" target="_blank">GitHub</a> ·
  <a href="#" id="logout-link">退出预览</a>
</footer>

<script>
/* ===== Hexagram data ===== */
const hexagrams = [
  {name:'乾',guaci:'元亨利贞'},{name:'坤',guaci:'元亨，利牝马之贞'},
  {name:'屯',guaci:'元亨利贞，勿用有攸往'},{name:'蒙',guaci:'亨，匪我求童蒙'},
  {name:'需',guaci:'有孚，光亨，贞吉'},{name:'讼',guaci:'有孚窒惕，中吉'},
  {name:'师',guaci:'贞，丈人吉，无咎'},{name:'比',guaci:'吉，原筮元永贞，无咎'},
  {name:'小畜',guaci:'亨，密云不雨'},{name:'履',guaci:'履虎尾，不咥人，亨'},
  {name:'泰',guaci:'小往大来，吉亨'},{name:'否',guaci:'否之匪人，不利君子贞'},
  {name:'同人',guaci:'同人于野，亨'},{name:'大有',guaci:'元亨'},
  {name:'谦',guaci:'亨，君子有终'},{name:'豫',guaci:'利建侯行师'},
  {name:'随',guaci:'元亨利贞，无咎'},{name:'蛊',guaci:'元亨，利涉大川'},
  {name:'临',guaci:'元亨利贞'},{name:'观',guaci:'盥而不荐，有孚颙若'},
  {name:'噬嗑',guaci:'亨，利用狱'},{name:'贲',guaci:'亨，小利有攸往'},
  {name:'剥',guaci:'不利有攸往'},{name:'复',guaci:'亨，出入无疾'},
  {name:'无妄',guaci:'元亨利贞'},{name:'大畜',guaci:'利贞，不家食吉'},
  {name:'颐',guaci:'贞吉，观颐'},{name:'大过',guaci:'栋桡，利有攸往，亨'},
  {name:'坎',guaci:'有孚维心亨'},{name:'离',guaci:'利贞，亨'},
  {name:'咸',guaci:'亨利贞，取女吉'},{name:'恒',guaci:'亨无咎利贞'},
  {name:'遁',guaci:'亨，小利贞'},{name:'大壮',guaci:'利贞'},
  {name:'晋',guaci:'康侯用锡马蕃庶'},{name:'明夷',guaci:'利艰贞'},
  {name:'家人',guaci:'利女贞'},{name:'睽',guaci:'小事吉'},
  {name:'蹇',guaci:'利西南，不利东北'},{name:'解',guaci:'利西南'},
  {name:'损',guaci:'有孚，元吉无咎'},{name:'益',guaci:'利有攸往，利涉大川'},
  {name:'夬',guaci:'扬于王庭'},{name:'姤',guaci:'女壮，勿用取女'},
  {name:'萃',guaci:'亨，王假有庙'},{name:'升',guaci:'元亨，用见大人'},
  {name:'困',guaci:'亨贞，大人吉'},{name:'井',guaci:'改邑不改井'},
  {name:'革',guaci:'巳日乃孚，元亨利贞'},{name:'鼎',guaci:'元吉，亨'},
  {name:'震',guaci:'亨，震来虩虩'},{name:'艮',guaci:'艮其背，不获其身'},
  {name:'渐',guaci:'女归吉，利贞'},{name:'归妹',guaci:'征凶，无攸利'},
  {name:'丰',guaci:'亨，王假之'},{name:'旅',guaci:'小亨，旅贞吉'},
  {name:'巽',guaci:'小亨，利有攸往'},{name:'兑',guaci:'亨，利贞'},
  {name:'涣',guaci:'亨，王假有庙'},{name:'节',guaci:'亨，苦节不可贞'},
  {name:'中孚',guaci:'豚鱼吉，利涉大川'},{name:'小过',guaci:'亨利贞，可小事'},
  {name:'既济',guaci:'亨小，利贞'},{name:'未济',guaci:'亨，小狐汔济'}
];

const d = new Date();
const todayId = ((d.getFullYear() * 366 + d.getMonth() * 31 + d.getDate()) % 64) + 1;

/* ===== Random hexagram card ===== */
const randomId = Math.floor(Math.random() * 64) + 1;
const rHex = hexagrams[randomId - 1];
const rSym = String.fromCodePoint(0x4DBF + randomId);
const rCard = document.getElementById('random-card');
rCard.innerHTML = `<span class="random-sym">${rSym}</span>
  <div class="random-info">
    <span class="random-label">随机一卦</span>
    <span class="random-name">第${randomId}卦 · ${rHex.name}</span>
    <span class="random-guaci">${rHex.guaci}</span>
  </div>
  <span class="random-arrow">→</span>`;
rCard.onclick = (e) => { e.preventDefault(); alert('第' + randomId + '卦 · ' + rHex.name + '\n\n' + rHex.guaci + '\n\n（详情页开发中）'); };

/* ===== Hexagram grid with staggered entrance ===== */
const grid = document.getElementById('hex-grid');
hexagrams.forEach((hex, i) => {
  const id = i + 1;
  const sym = String.fromCodePoint(0x4DBF + id);
  const cell = document.createElement('div');
  cell.className = 'hex-cell' + (id === todayId ? ' today' : '');
  cell.innerHTML = `<span class="hex-sym">${sym}</span>
    <span class="hex-name">${hex.name}</span>
    <span class="hex-num">${id}</span>`;
  cell.onclick = () => alert('第' + id + '卦 · ' + hex.name + '\n' + hex.guaci);
  grid.appendChild(cell);
});

/* ===== Scroll-triggered animations ===== */
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      /* For hex-cell: staggered delay based on index */
      if (entry.target.classList.contains('hex-cell')) {
        const idx = Array.from(grid.children).indexOf(entry.target);
        const row = Math.floor(idx / 8);
        const col = idx % 8;
        entry.target.style.transitionDelay = (row * 0.04 + col * 0.02) + 's';
        entry.target.classList.add('show');
      } else {
        entry.target.classList.add('visible');
      }
      observer.unobserve(entry.target);
    }
  });
}, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });

/* Observe all fade-in elements */
document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));
/* Observe hex cells */
document.querySelectorAll('.hex-cell').forEach(el => observer.observe(el));

/* ===== Cover parallax: fade out on scroll ===== */
const cover = document.querySelector('.cover');
const coverInner = document.querySelector('.cover-inner');
const scrollHint = document.getElementById('scroll-hint');

window.addEventListener('scroll', () => {
  const scrollY = window.scrollY;
  const vh = window.innerHeight;
  const progress = Math.min(scrollY / (vh * 0.5), 1);
  /* Cover content fades and drifts up */
  coverInner.style.opacity = 1 - progress;
  coverInner.style.transform = 'translateY(' + (-scrollY * 0.3) + 'px)';
  /* Hide scroll hint once user starts scrolling */
  if (scrollY > 20) {
    scrollHint.classList.add('hidden');
  } else {
    scrollHint.classList.remove('hidden');
  }
}, { passive: true });

/* ===== Auth Gate Logic ===== */
const AUTH_KEY = 'yaoguayi_dev_auth';
/* SHA-256 hash of the password, not the password itself */
const AUTH_HASH = '533ec688bba2dda0ba454564a7372550e1cc83fa43fdb82c1b71cebeb027f11b';
const gate = document.getElementById('auth-gate');
const authInput = document.getElementById('auth-input');
const authBtn = document.getElementById('auth-btn');
const authError = document.getElementById('auth-error');

/* Compute SHA-256 hash using Web Crypto API */
async function sha256(message) {
  const msgBuffer = new TextEncoder().encode(message);
  const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

function unlockSite() {
  localStorage.setItem(AUTH_KEY, 'true');
  gate.classList.add('hidden');
  setTimeout(() => gate.classList.add('removed'), 700);
  document.querySelectorAll('.cover .fade-in').forEach(el => el.classList.add('visible'));
}

if (localStorage.getItem(AUTH_KEY) === 'true') {
  gate.classList.add('removed');
  window.addEventListener('load', () => {
    document.querySelectorAll('.cover .fade-in').forEach(el => el.classList.add('visible'));
  });
} else {
  authInput.focus();
}

authBtn.addEventListener('click', async () => {
  const inputHash = await sha256(authInput.value);
  if (inputHash === AUTH_HASH) {
    unlockSite();
  } else {
    authError.classList.add('show');
    authInput.style.borderColor = 'rgba(192,57,43,0.4)';
    setTimeout(() => {
      authError.classList.remove('show');
      authInput.style.borderColor = '';
    }, 2000);
  }
});

authInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') authBtn.click();
});

/* Logout link */
document.getElementById('logout-link').addEventListener('click', (e) => {
  e.preventDefault();
  localStorage.removeItem(AUTH_KEY);
  location.reload();
});
</script>
</body>
</html>
