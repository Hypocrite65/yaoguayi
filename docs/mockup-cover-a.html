<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<title>爻卦易 · 方案A</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;background:#f5f0e8;
  font-family:'Noto Serif SC','STSong','SimSun',serif;color:#1a1a1a;
  overflow:hidden;}
nav{position:fixed;top:0;left:0;right:0;padding:20px 36px;
  display:flex;justify-content:space-between;align-items:center;z-index:10;}
.logo{font-size:13px;letter-spacing:0.22em;}
.nav-r{display:flex;gap:24px;}
.nav-r a{font-size:10.5px;letter-spacing:0.14em;color:#a09080;text-decoration:none;cursor:pointer;}
main{position:fixed;top:0;left:0;right:0;bottom:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;}
.seq{font-size:11px;letter-spacing:0.22em;color:#c0392b;
  opacity:0;animation:up 1s 0.9s ease-out forwards;}
.gua-sym{font-size:160px;line-height:1;color:#1a1a1a;cursor:pointer;
  opacity:0;animation:up 1.2s 1.1s ease-out forwards;
  transition:opacity 0.2s,transform 0.3s;user-select:none;}
.gua-sym:hover{opacity:0.75!important;transform:scale(0.97);}
.gua-name{font-size:24px;letter-spacing:0.4em;margin-top:12px;
  opacity:0;animation:up 1s 1.8s ease-out forwards;}
.tagline{font-size:11px;letter-spacing:0.28em;color:#a09080;margin-top:28px;
  opacity:0;animation:up 1s 2.3s ease-out forwards;}
footer{position:fixed;bottom:0;left:0;right:0;padding:20px;
  text-align:center;font-size:10px;letter-spacing:0.22em;color:#c8b8a4;
  opacity:0;animation:up 1s 2.8s ease-out forwards;}
@keyframes up{
  from{opacity:0;transform:translateY(10px);}
  to{opacity:1;transform:translateY(0);}
}
/* 细线装饰 */
.line-h{width:40px;height:0.5px;background:rgba(26,26,26,0.2);margin:20px auto 0;
  opacity:0;animation:up 1s 2s ease-out forwards;}
</style>
</head>
<body>
<nav>
  <div class="logo">爻卦易</div>
  <div class="nav-r">
    <a>六十四卦</a><a>起卦</a><a>读易</a>
  </div>
</nav>
<main>
  <div class="seq" id="seq"></div>
  <div class="gua-sym" id="sym" title="点击进入"></div>
  <div class="gua-name" id="name"></div>
  <div class="line-h"></div>
  <div class="tagline">六十四卦皆为入口</div>
</main>
<footer>仰則觀象於天 &nbsp;·&nbsp; 《易·繫辭傳》</footer>
<script>
const names=['','乾','坤','屯','蒙','需','訟','師','比','小畜','履','泰','否','同人','大有','謙','豫','隨','蠱','臨','觀','噬嗑','賁','剝','復','無妄','大畜','頤','大過','坎','離','咸','恆','遯','大壯','晉','明夷','家人','睽','蹇','解','損','益','夬','姤','萃','升','困','井','革','鼎','震','艮','漸','歸妹','豐','旅','巽','兌','渙','節','中孚','小過','既濟','未濟'];
const nums=['一','二','三','四','五','六','七','八','九','十','十一','十二','十三','十四','十五','十六','十七','十八','十九','二十','二十一','二十二','二十三','二十四','二十五','二十六','二十七','二十八','二十九','三十','三十一','三十二','三十三','三十四','三十五','三十六','三十七','三十八','三十九','四十','四十一','四十二','四十三','四十四','四十五','四十六','四十七','四十八','四十九','五十','五十一','五十二','五十三','五十四','五十五','五十六','五十七','五十八','五十九','六十','六十一','六十二','六十三','六十四'];
const d=new Date();
const id=((d.getFullYear()*366+d.getMonth()*31+d.getDate())%64)+1;
document.getElementById('seq').textContent='第'+nums[id-1]+'卦';
document.getElementById('sym').textContent=String.fromCodePoint(0x4DBF+id);
document.getElementById('name').textContent=names[id];
document.getElementById('sym').onclick=()=>alert('→ 进入第'+id+'卦 · '+names[id]);
</script>
</body>
</html>
