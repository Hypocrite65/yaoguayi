<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<title>爻卦易 · 方案B</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;background:#f0ebe0;
  font-family:'Noto Serif SC','STSong','SimSun',serif;color:#1a1a1a;overflow:hidden;}
nav{position:fixed;top:0;left:0;right:0;height:48px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 32px;background:#f0ebe0;
  border-bottom:0.5px solid rgba(26,26,26,0.1);z-index:10;}
.logo{font-size:13px;letter-spacing:0.22em;}
.nav-r a{font-size:10.5px;letter-spacing:0.14em;color:#a09080;
  text-decoration:none;margin-left:24px;cursor:pointer;}
#grid-wrap{position:fixed;top:48px;left:0;right:0;bottom:40px;
  overflow:hidden;display:flex;align-items:center;justify-content:center;
  padding:12px 24px;}
#grid{display:grid;grid-template-columns:repeat(8,1fr);
  width:100%;max-width:960px;gap:0;
  border:0.5px solid rgba(26,26,26,0.14);
  animation:fadeIn 1.2s 0.2s ease-out both;}
.cell{
  aspect-ratio:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  border:0.5px solid rgba(26,26,26,0.1);
  cursor:pointer;position:relative;
  transition:background 0.2s;padding:6px;
  background:#f0ebe0;
}
.cell:hover{background:#e8e0d0;}
.cell.today{background:rgba(192,57,43,0.06);}
.cell-num{position:absolute;top:5px;left:6px;
  font-size:8px;color:#b8a898;letter-spacing:0.06em;}
.cell-sym{font-size:18px;line-height:1;color:#1a1a1a;opacity:0;
  transition:opacity 0.18s;margin-bottom:2px;}
.cell:hover .cell-sym{opacity:0.75;}
.cell.today .cell-sym{opacity:0.5;color:#c0392b;}
.cell-name{font-size:14px;letter-spacing:0.12em;color:#1a1a1a;
  transition:font-size 0.18s;}
.cell:hover .cell-name{font-size:15px;}
.cell.today .cell-name{color:#c0392b;}
footer{position:fixed;bottom:0;left:0;right:0;height:40px;
  display:flex;align-items:center;justify-content:center;
  border-top:0.5px solid rgba(26,26,26,0.08);}
footer span{font-size:10px;letter-spacing:0.2em;color:#b8a898;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
</style>
</head>
<body>
<nav>
  <div class="logo">爻卦易</div>
  <div class="nav-r">
    <a>起卦</a><a>读易</a><a>关于</a>
  </div>
</nav>
<div id="grid-wrap"><div id="grid"></div></div>
<footer><span>六十四卦 · 点击任意卦名进入</span></footer>
<script>
const names=['乾','坤','屯','蒙','需','訟','師','比','小畜','履','泰','否','同人','大有','謙','豫','隨','蠱','臨','觀','噬嗑','賁','剝','復','無妄','大畜','頤','大過','坎','離','咸','恆','遯','大壯','晉','明夷','家人','睽','蹇','解','損','益','夬','姤','萃','升','困','井','革','鼎','震','艮','漸','歸妹','豐','旅','巽','兌','渙','節','中孚','小過','既濟','未濟'];
const d=new Date();
const todayId=((d.getFullYear()*366+d.getMonth()*31+d.getDate())%64)+1;
const grid=document.getElementById('grid');
names.forEach((name,i)=>{
  const id=i+1;
  const sym=String.fromCodePoint(0x4DBF+id);
  const cell=document.createElement('div');
  cell.className='cell'+(id===todayId?' today':'');
  cell.innerHTML=`<span class="cell-num">${id}</span>
    <span class="cell-sym">${sym}</span>
    <span class="cell-name">${name}</span>`;
  cell.onclick=()=>alert('→ 第'+id+'卦 · '+name);
  grid.appendChild(cell);
});
</script>
</body>
</html>
