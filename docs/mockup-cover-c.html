<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<title>爻卦易 · 方案C</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;overflow:hidden;
  font-family:'Noto Serif SC','STSong','SimSun',serif;color:#1a1a1a;}
/* 双页书展开 */
#book{width:100%;height:100%;display:flex;}
/* 左页 */
#left{flex:0 0 38%;background:#f5f0e8;
  display:flex;flex-direction:column;justify-content:center;
  padding:60px 52px 60px 60px;
  border-right:1px solid rgba(26,26,26,0.12);
  position:relative;}
/* 左页装饰竖线 */
#left::before{content:'';position:absolute;right:0;top:15%;bottom:15%;
  width:0.5px;background:rgba(26,26,26,0.08);}
.book-logo{font-size:12px;letter-spacing:0.3em;color:#a09080;margin-bottom:52px;}
.book-title{font-size:42px;letter-spacing:0.18em;line-height:1.3;margin-bottom:20px;}
.book-sub{font-size:13px;letter-spacing:0.12em;color:#6a5e54;line-height:1.9;margin-bottom:40px;}
.book-quote{font-size:11px;letter-spacing:0.18em;color:#a09080;
  line-height:2;border-left:1.5px solid rgba(192,57,43,0.4);
  padding-left:14px;margin-bottom:48px;}
.book-quote em{display:block;font-size:10px;color:#c8b8a4;margin-top:4px;font-style:normal;}
.book-links{display:flex;gap:0;flex-direction:column;gap:14px;}
.book-link{font-size:11px;letter-spacing:0.18em;color:#7a6e64;cursor:pointer;
  display:flex;align-items:center;gap:10px;text-decoration:none;
  transition:color 0.2s;}
.book-link:hover{color:#c0392b;}
.book-link::before{content:'';width:20px;height:0.5px;
  background:currentColor;transition:width 0.2s;}
.book-link:hover::before{width:32px;}
/* 右页 */
#right{flex:1;background:#ede8dc;overflow:hidden;
  display:flex;flex-direction:column;}
.right-header{padding:20px 32px;border-bottom:0.5px solid rgba(26,26,26,0.1);
  display:flex;align-items:baseline;gap:16px;flex-shrink:0;}
.right-title{font-size:11px;letter-spacing:0.22em;color:#a09080;}
.right-hint{font-size:10px;letter-spacing:0.14em;color:#c8b8a4;}
/* 卦象网格 */
#right-grid{flex:1;overflow-y:auto;
  display:grid;grid-template-columns:repeat(8,1fr);
  padding:16px 24px;gap:2px;align-content:start;}
.r-cell{display:flex;flex-direction:column;align-items:center;
  padding:10px 4px;cursor:pointer;border-radius:2px;
  transition:background 0.15s;position:relative;}
.r-cell:hover{background:rgba(26,26,26,0.06);}
.r-cell.today{background:rgba(192,57,43,0.07);}
.r-sym{font-size:20px;line-height:1;color:#1a1a1a;opacity:0.72;margin-bottom:3px;}
.r-cell.today .r-sym{color:#c0392b;opacity:0.9;}
.r-name{font-size:11px;letter-spacing:0.1em;color:#3d3630;}
.r-cell.today .r-name{color:#c0392b;}
.r-num{font-size:8px;color:#c0b8a8;margin-top:2px;}
/* 右页底部提示 */
.right-footer{flex-shrink:0;padding:10px 32px;
  border-top:0.5px solid rgba(26,26,26,0.08);
  font-size:9px;letter-spacing:0.16em;color:#c8b8a4;text-align:right;}
</style>
</head>
<body>
<div id="book">
  <!-- 左页 -->
  <div id="left">
    <div class="book-logo">爻卦易 · yaoguayi.com</div>
    <div class="book-title">六十四卦</div>
    <div class="book-sub">在 AI 加速的时代，<br>用三千年的智慧定一定位。<br>不是占卜，是观象。</div>
    <div class="book-quote">
      仰則觀象於天，俯則觀法於地，<br>
      近取諸身，遠取諸物，於是始作八卦。
      <em>——《周易·繫辭傳》</em>
    </div>
    <div class="book-links">
      <a class="book-link">六十四卦</a>
      <a class="book-link">起卦</a>
      <a class="book-link">读易</a>
      <a class="book-link">关于本站</a>
    </div>
  </div>
  <!-- 右页 -->
  <div id="right">
    <div class="right-header">
      <span class="right-title">六十四卦</span>
      <span class="right-hint">点击进入</span>
    </div>
    <div id="right-grid"></div>
    <div class="right-footer">今日卦象已标注 · 开源 · 非盈利</div>
  </div>
</div>
<script>
const names=['乾','坤','屯','蒙','需','訟','師','比','小畜','履','泰','否','同人','大有','謙','豫','隨','蠱','臨','觀','噬嗑','賁','剝','復','無妄','大畜','頤','大過','坎','離','咸','恆','遯','大壯','晉','明夷','家人','睽','蹇','解','損','益','夬','姤','萃','升','困','井','革','鼎','震','艮','漸','歸妹','豐','旅','巽','兌','渙','節','中孚','小過','既濟','未濟'];
const d=new Date();
const todayId=((d.getFullYear()*366+d.getMonth()*31+d.getDate())%64)+1;
const grid=document.getElementById('right-grid');
names.forEach((name,i)=>{
  const id=i+1;
  const sym=String.fromCodePoint(0x4DBF+id);
  const cell=document.createElement('div');
  cell.className='r-cell'+(id===todayId?' today':'');
  cell.innerHTML=`<span class="r-sym">${sym}</span>
    <span class="r-name">${name}</span>
    <span class="r-num">${id}</span>`;
  cell.onclick=()=>alert('→ 第'+id+'卦 · '+name);
  grid.appendChild(cell);
});
</script>
</body>
</html>
