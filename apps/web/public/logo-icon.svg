<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- 
    Yao Gua Yi (爻卦易) - Premium Glowing Rounded Favicon
    Version 2.0: Micro-scale Optical Adjustment
    - Completely removed blur filters to prevent optical fusion (melting lines).
    - Hardcoded high-contrast neon blue (#38bdf8) for supreme clarity.
    - Expanded Y-axis gap to 14 units (y=36, 50, 64) to maximize breathing room.
    - Expanded Yin-爻 gap to 10 units (45 to 55) to prevent square-box illusion.
    - Slightly shortened lines (39 to 61) to eliminate outer circle pixel bleeding.
  -->

  <!-- 1. Apple 风格极夜黑圆角背景 -->
  <rect width="100" height="100" rx="22" fill="#030712" />

  <!-- 2. 光学微调后的高对比度离卦 Logo 图标 -->
  <g stroke="#38bdf8" fill="none" stroke-linecap="round">
    <!-- 外圆：加粗保证低分屏锐利度 -->
    <circle cx="50" cy="50" r="32" stroke-width="3.5" />
    
    <!-- 上爻：实线 (Yang) -->
    <line x1="39" y1="36" x2="61" y2="36" stroke-width="3.8" />
    
    <!-- 中爻：断线 (Yin) -->
    <line x1="39" y1="50" x2="45" y2="50" stroke-width="3.8" />
    <line x1="55" y1="50" x2="61" y2="50" stroke-width="3.8" />
    
    <!-- 下爻：实线 (Yang) -->
    <line x1="39" y1="64" x2="61" y2="64" stroke-width="3.8" />
  </g>
</svg>
