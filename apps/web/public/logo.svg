<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <!-- 
    Yao Gua Yi (爻卦易) - Ultra Minimalist SVG Logo
    Design Philosophy:
    - Pure perfect circle representing Infinite/Taiji (无极/太极).
    - Inner trigram is Li (离卦 ☲), representing light, awareness, and AI sparks.
    - Built-in stroke path animation for premium visual experience.
  -->
  <style>
    .logo-circle {
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-dasharray: 264;
      stroke-dashoffset: 264;
      animation: drawCircle 1.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
    
    .logo-line {
      stroke: currentColor;
      stroke-width: 2.8;
      stroke-linecap: round;
      opacity: 0;
      animation: fadeInLine 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
    
    .line-bottom {
      animation-delay: 0.4s;
    }
    
    .line-mid-1 {
      animation-delay: 0.7s;
    }
    
    .line-mid-2 {
      animation-delay: 0.7s;
    }
    
    .line-top {
      animation-delay: 1s;
    }

    @keyframes drawCircle {
      to {
        stroke-dashoffset: 0;
      }
    }

    @keyframes fadeInLine {
      from {
        opacity: 0;
        transform: translateY(2px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>

  <!-- Outer Circle representing Taiji -->
  <circle class="logo-circle" cx="50" cy="50" r="41" />

  <!-- Trigram: Li (离 ☲) - Bottom Line (Yang) -->
  <line class="logo-line line-bottom" x1="31" y1="62" x2="69" y2="62" />

  <!-- Trigram: Li (离 ☲) - Middle Line (Yin, split) -->
  <line class="logo-line line-mid-1" x1="31" y1="50" x2="47" y2="50" />
  <line class="logo-line line-mid-2" x1="53" y1="50" x2="69" y2="50" />

  <!-- Trigram: Li (离 ☲) - Top Line (Yang) -->
  <line class="logo-line line-top" x1="31" y1="38" x2="69" y2="38" />
</svg>
